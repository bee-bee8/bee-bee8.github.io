    .hero {

      align-items: flex-end;
      gap: 18px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);

      line-height: 1.55;
    }

    .readout-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 178px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      font-size: 22px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .sky-panel {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border: 6px solid #ffffff;
      border-radius: 22px;
      box-shadow: 0 22px 44px rgba(20, 32, 51, 0.16);
      cursor: grab;
      touch-action: none;
      user-select: none;
      background: linear-gradient(to top, rgb(224, 242, 254), rgb(2, 132, 199));
    }

    .sky-panel:active {
      cursor: grabbing;
    }

    .sun-path {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cloud-layer {
      position: absolute;
      inset: 28px 0 auto;
      z-index: 2;
      height: 92px;
      overflow: hidden;
      pointer-events: none;
      color: #ffffff;
    }

    .cloud {
      position: absolute;
      opacity: 0.34;
      filter: blur(0.2px);
    }

    .cloud.one {
      top: 6px;
      width: 140px;
      animation: drift-right 46s linear infinite;
    }

    .cloud.two {
      top: 42px;
      width: 174px;
      opacity: 0.25;
      animation: drift-left 38s linear infinite;
    }

    @keyframes drift-right {
      from { transform: translateX(-18vw); }
      to { transform: translateX(110vw); }
    }

    @keyframes drift-left {
      from { transform: translateX(112vw); }
      to { transform: translateX(-22vw); }
    }

    .sun {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      width: 92px;
      height: 92px;
      margin: -46px 0 0 -46px;
      border-radius: 999px;
      transition: left 700ms cubic-bezier(0.25, 1, 0.5, 1), top 700ms cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    .sun.no-transition {
      transition: none;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: -10px;
      border: 2px dashed rgba(255, 245, 157, 0.65);
      border-radius: inherit;
      animation: spin 20s linear infinite;
    }

    .sun::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: #facc15;
      box-shadow: 0 0 34px #facc15, 0 0 76px rgba(253, 224, 71, 0.58);
      filter: blur(8px);
      opacity: 0.84;
      animation: pulse 2.4s ease-in-out infinite;
    }

    .sun-core {
      position: absolute;
      inset: 14px;
      z-index: 1;
      display: grid;
      place-items: center;
      border: 2px solid #f59e0b;
      border-radius: inherit;
      background: #fde047;
      color: #451a03;
      font: 900 13px/1 "JetBrains Mono", Consolas, monospace;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.08);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.96); opacity: 0.76; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }

    .ground {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      height: 188px;
      border-top: 4px solid #22c55e;
      background: linear-gradient(to top, #16a34a, #4ade80);
      transition: filter 600ms ease;
    }

    .ground-labels {
      position: absolute;
      inset: auto 22px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #082f1f;
      font-weight: 900;
      pointer-events: none;
    }

    .ground-labels span {
      padding: 8px 14px;
      border: 1px solid rgba(6, 78, 59, 0.25);
      border-radius: var(--radius);
      background: rgba(6, 78, 59, 0.16);
    }

    .ruler-grid {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 80px;
      height: 34px;
      color: rgba(6, 78, 59, 0.78);
      pointer-events: none;
    }

    .object-stage {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 130px;
      width: 150px;
      height: 210px;
      transform: translateX(-50%);
      transform-origin: bottom center;
      pointer-events: none;
    }

    .object-stage svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 6px 8px rgba(15, 23, 42, 0.18));
    }

    .shadow-stage {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 130px;
      width: 150px;
      height: 210px;
      transform: translateX(-50%) scaleY(-0.35) skewX(0deg) scaleX(0.6);
      transform-origin: bottom center;
      filter: brightness(0) opacity(0.58) blur(1.2px);
      pointer-events: none;
      transition: transform 700ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    .shadow-stage.no-transition {
      transition: none;
    }

    .pin {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 130px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border: 1px solid #111827;
      border-radius: 50%;
      background: #facc15;
      pointer-events: none;
    }

    .control-panel {
      display: grid;
      grid-template-columns: auto minmax(320px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .button-row,
    .object-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      padding: 10px 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 120ms ease, border-color 160ms ease, background 160ms ease;
    }

    .btn:hover,
    .btn:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: #b8c4d5;
      background: #f8fafc;
    }

    .btn.primary {
      min-width: 112px;
      border-color: #047857;
      background: #059669;
      color: #ffffff;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
    }

    .btn.primary.is-playing {
      border-color: #b91c1c;
      background: #ef4444;
    }

    .btn.object-btn[aria-pressed="true"] {
      border-color: var(--brand);
      background: #eff6ff;
      color: #1d4ed8;
    }

    .time-control {
      display: grid;
      gap: 8px;
    }

    .time-control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .time-control input[type="range"] {
      width: 100%;
      height: 12px;
      accent-color: var(--brand);
      cursor: pointer;
    }

    .ticks {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #7b8797;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .preset-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: -4px;
    }

    .preset-btn {
      border: 1px solid var(--line);

      background: #f8fafc;
      color: #334155;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .info-card {
      min-height: 96px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .info-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .info-value {
      display: block;
      color: var(--ink);
      font-size: clamp(20px, 1.6vw, 26px);
      font-weight: 900;
      line-height: 1.2;
    }

    .explain {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .explain h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .explain ul {
      margin: 0;
      padding-left: 1.25em;
      color: #344054;
      font-size: 16px;
      line-height: 1.75;
    }

    @media (max-width: 920px) {
      .hero,
      .control-panel {
        grid-template-columns: 1fr;
      }

      .hero {
        display: grid;
        align-items: start;
      }

      .readout-pill {
        width: fit-content;
      }

      .control-panel {
        display: grid;
      }

      .button-row,
      .object-switcher {
        width: 100%;
      }

      .info-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100vw - 18px, 1540px);
        padding: 82px 0 18px;
      }

      .top-button,
      #tool-home-link {
        width: 104px;
        min-height: 46px;
        padding: 0 6px;
        font-size: 18px;
      }

      #tool-home-link {
        left: max(8px, env(safe-area-inset-left));
      }

      .exit-fullscreen {
        left: max(118px, calc(env(safe-area-inset-left) + 118px));
      }

      .enter-fullscreen {
        right: max(8px, env(safe-area-inset-right));
      }

      .ldl-visible-watermark {
        left: max(8px, env(safe-area-inset-left));
        top: max(58px, calc(env(safe-area-inset-top) + 54px));
        font-size: 7px;
      }

      .ldl-watermark-mark {
        width: 14px;
        height: 14px;
        font-size: 6px;
      }

      .sky-panel {
        min-height: 430px;
        border-width: 4px;
        border-radius: 14px;
      }

      .ground {
        height: 158px;
      }

      .object-stage,
      .shadow-stage {
        width: 120px;
        height: 168px;
        bottom: 112px;
      }

      .pin {
        bottom: 112px;
      }

      .ground-labels {
        inset: auto 10px 10px;
        font-size: 13px;
      }

      .ruler-grid {
        bottom: 66px;
      }

      .button-row .btn,
      .object-switcher .btn {
        flex: 1 1 116px;
      }

      .ticks {
        font-size: 10px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }

            <path d="M56 79 Q60 83 64 79" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"></path>
          </svg>`
      };

      const dom = {
        skyPanel: document.getElementById("skyPanel"),
        sunNode: document.getElementById("sunNode"),
        sunTime: document.getElementById("sunTime"),
        groundNode: document.getElementById("groundNode"),
        objectStage: document.getElementById("objectStage"),
        shadowStage: document.getElementById("shadowStage"),
        clockReadout: document.getElementById("clockReadout"),
        timeRangeLabel: document.getElementById("timeRangeLabel"),
        timeRange: document.getElementById("timeRange"),
        playPauseBtn: document.getElementById("playPauseBtn"),
        resetBtn: document.getElementById("resetBtn"),
        altitudeReadout: document.getElementById("altitudeReadout"),
        sunDirectionReadout: document.getElementById("sunDirectionReadout"),
        shadowDirectionReadout: document.getElementById("shadowDirectionReadout"),
        shadowLengthReadout: document.getElementById("shadowLengthReadout"),
        enterFullscreen: document.getElementById("enterFullscreen"),
        exitFullscreen: document.getElementById("exitFullscreen")
      };

      let timeValue = 12;
      let activeObject = "tree";
      let isPlaying = false;
      let isDragging = false;
      let useTransition = true;
      let timerId = null;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function lerp(a, b, ratio) {
        return Math.round(a + (b - a) * ratio);
      }

      function getSkyColors(t) {
        let k1 = SKY_KEYFRAMES[0];
        let k2 = SKY_KEYFRAMES[SKY_KEYFRAMES.length - 1];
        for (let i = 0; i < SKY_KEYFRAMES.length - 1; i += 1) {
          if (t >= SKY_KEYFRAMES[i].h && t <= SKY_KEYFRAMES[i + 1].h) {
            k1 = SKY_KEYFRAMES[i];
            k2 = SKY_KEYFRAMES[i + 1];
            break;
          }
        }
        const ratio = k2.h === k1.h ? 0 : (t - k1.h) / (k2.h - k1.h);
        const toRgb = (a, b) => `rgb(${lerp(a[0], b[0], ratio)}, ${lerp(a[1], b[1], ratio)}, ${lerp(a[2], b[2], ratio)})`;
        return { bottom: toRgb(k1.bottom, k2.bottom), top: toRgb(k1.top, k2.top) };
      }

      function formatClock(val, withPeriod = true) {
        const hours = Math.floor(val);
        const minutes = Math.round((val - hours) * 60);
        const normalizedHours = minutes === 60 ? hours + 1 : hours;
        const normalizedMinutes = minutes === 60 ? 0 : minutes;
        const time = `${String(normalizedHours).padStart(2, "0")}:${String(normalizedMinutes).padStart(2, "0")}`;
        if (!withPeriod) return time;
        if (normalizedHours < 11) return `早上 ${time}`;
        if (normalizedHours <= 13) return `中午 ${time}`;
        return `下午 ${time}`;
      }

      function getDirectionText(kind, t) {
        if (kind === "sun") {
          if (t < 11.2) return "偏東方";
          if (t <= 12.8) return "天頂正上方";
          return "偏西方";
        }
        if (t < 11.2) return "偏西方";
        if (t <= 12.8) return "地面正下方";
        return "偏東方";
      }

      function getShadowLengthText(angle) {
        if (angle >= 80) return "最短";
        if (angle >= 50) return "中等偏短";
        if (angle >= 25) return "較長";
        return "最長";
      }

      function setObject(objectName) {
        activeObject = objectName;
        dom.objectStage.innerHTML = templates[activeObject];
        dom.shadowStage.innerHTML = templates[activeObject];
        document.querySelectorAll(".object-btn").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.object === activeObject));
        });
      }

      function render() {
        const colors = getSkyColors(timeValue);
        const p = (timeValue - 6) / 12;
        const sunX = 10 + 80 * p;
        const sunY = 85 - 280 * p * (1 - p);
        const theta = p * Math.PI;
        const cosVal = Math.cos(theta);
        const sinVal = Math.sin(theta);
        const skewX = -cosVal * 68;
        const scaleX = 0.6 + 2.5 * Math.abs(cosVal);
        const scaleY = 0.35;
        const sunsetFactor = Math.abs(timeValue - 12) / 6;
        const angle = Math.round(sinVal * 90);

        dom.skyPanel.style.background = `linear-gradient(to top, ${colors.bottom}, ${colors.top})`;
        dom.groundNode.style.filter = `brightness(${1 - sunsetFactor * 0.22}) saturate(${1 + sunsetFactor * 0.15})`;
        dom.sunNode.style.left = `${sunX}%`;
        dom.sunNode.style.top = `${sunY}%`;
        dom.sunNode.classList.toggle("no-transition", !useTransition);
        dom.shadowStage.classList.toggle("no-transition", !useTransition);
        dom.shadowStage.style.transform = `translateX(-50%) scaleY(${-scaleY}) skewX(${skewX}deg) scaleX(${scaleX})`;

        dom.sunTime.textContent = formatClock(timeValue, false);
        dom.clockReadout.textContent = formatClock(timeValue, true);
        dom.timeRangeLabel.textContent = formatClock(timeValue, false);
        dom.timeRange.value = String(timeValue);
        dom.altitudeReadout.textContent = `${angle}°`;
        dom.sunDirectionReadout.textContent = getDirectionText("sun", timeValue);
        dom.shadowDirectionReadout.textContent = getDirectionText("shadow", timeValue);
        dom.shadowLengthReadout.textContent = getShadowLengthText(angle);

        dom.playPauseBtn.textContent = isPlaying ? "暫停" : "播放";
        dom.playPauseBtn.classList.toggle("is-playing", isPlaying);
      }

      function setTime(value, transition) {
        timeValue = clamp(Math.round(value * 20) / 20, 6, 18);
        useTransition = Boolean(transition);
        render();
      }

      function stopPlayback() {
        isPlaying = false;
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        render();
      }

      function startPlayback() {
        isPlaying = true;
        useTransition = false;
        timerId = window.setInterval(() => {
          const next = timeValue + 0.08 > 18.01 ? 6 : timeValue + 0.08;
          setTime(next, false);
        }, 80);
        render();
      }

      function updateTimeFromPointer(event) {
        const rect = dom.skyPanel.getBoundingClientRect();
        const percent = clamp((event.clientX - rect.left) / rect.width, 0.1, 0.9);
        setTime(6 + ((percent - 0.1) / 0.8) * 12, false);
      }

      dom.skyPanel.addEventListener("pointerdown", (event) => {
        dom.skyPanel.setPointerCapture(event.pointerId);
        isDragging = true;
        stopPlayback();
        updateTimeFromPointer(event);
      });

      dom.skyPanel.addEventListener("pointermove", (event) => {
        if (isDragging) updateTimeFromPointer(event);
      });

      ["pointerup", "pointercancel", "lostpointercapture"].forEach((eventName) => {
        dom.skyPanel.addEventListener(eventName, () => {
          isDragging = false;
        });
      });

      dom.timeRange.addEventListener("input", (event) => {
        stopPlayback();
        setTime(Number(event.currentTarget.value), false);
      });

      dom.playPauseBtn.addEventListener("click", () => {
        if (isPlaying) stopPlayback();
        else startPlayback();
      });

      dom.resetBtn.addEventListener("click", () => {
        stopPlayback();
        setTime(12, true);
      });

      document.querySelectorAll(".preset-btn").forEach((button) => {
        button.addEventListener("click", () => {
          stopPlayback();
          setTime(Number(button.dataset.time), true);
        });
      });

      document.querySelectorAll(".object-btn").forEach((button) => {
        button.addEventListener("click", () => {
          useTransition = true;
          setObject(button.dataset.object);
          render();
        });
      });

      dom.enterFullscreen.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.warn("Unable to enter fullscreen.", error);
        }
      });

      dom.exitFullscreen.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } catch (error) {
          console.warn("Unable to exit fullscreen.", error);
        }
      });

      window.addEventListener("pagehide", stopPlayback);
      setObject(activeObject);
      render();
    })();
