      Object.entries(metaValues).forEach(([name, content]) => {
        let meta = document.head.querySelector(`meta[name="${name}"]`);

    function upsertLDLBodyAttributes(record) {
      document.body.dataset.ldlCompany = record.company;
      document.body.dataset.ldlAuthor = record.author;

    function upsertLDLJsonRecord(record) {
      let script = document.getElementById("ldl-source-reference");
      if (!script) {
        script = document.createElement("script");
        script.type = "application/json";
        script.id = "ldl-source-reference";
        document.body.appendChild(script);

      script.textContent = JSON.stringify(record, null, 2);

    function upsertLDLHiddenDomReference(record) {
      const element = getOrCreateLDLElement("div", "ldl-hidden-source-reference", document.body);
      element.className = "ldl-hidden-source-reference";
      element.hidden = true;
      element.dataset.productName = record.productName;
      element.dataset.productNameEn = record.productNameEn;
      element.dataset.productCode = record.productCode;
      element.dataset.toolId = record.toolId;

    function upsertLDLVisibleWatermark() {

      watermark.className = "ldl-visible-watermark";

    function getOrCreateLDLElement(tagName, id, parent) {
      let element = document.getElementById(id);
      if (!element) {
        element = document.createElement(tagName);
        element.id = id;
        parent.appendChild(element);
      }
      return element;
    }

    const PLACE_NAMES = ["個位", "十位", "百位"];
    const PLACE_SHORT = ["個", "十", "百"];
    const PLACE_CLASSES = ["ones", "tens", "hundreds"];
    const DISPLAY_PLACES = [2, 1, 0];

    let appState;
    let borrowAnimationToken = 0;

    function toDigits(number) {
      return [
        number % 10,
        Math.floor(number / 10) % 10,
        Math.floor(number / 100) % 10
      ];
    }

    function arraysEqual(a, b) {
      return Array.isArray(a) &&
        Array.isArray(b) &&
        a.length === b.length &&
        a.every((value, index) => value === b[index]);
    }

    function cloneData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function computeSubtractionSteps(minuend, subtrahend) {
      const minuendDigits = toDigits(minuend);
      const subtrahendDigits = toDigits(subtrahend);
      const workingDigits = minuendDigits.slice();
      const steps = [];
      const resultDigits = [0, 0, 0];

      for (let place = 0; place < 3; place += 1) {
        const workingDigitsBefore = workingDigits.slice();
        const beforeBorrowValue = workingDigits[place];
        const subtrahendValue = subtrahendDigits[place];
        const needBorrow = beforeBorrowValue < subtrahendValue;
        const borrowChain = [];

        if (needBorrow) {
          let donorPlace = place + 1;
          while (donorPlace < 3 && workingDigits[donorPlace] === 0) {
            donorPlace += 1;
          }

          if (donorPlace >= 3) {
            throw new Error("Invalid subtraction model: borrow source not found.");
          }

          for (let from = donorPlace; from > place; from -= 1) {
            const to = from - 1;
            const fromBefore = workingDigits[from];
            const toBefore = workingDigits[to];
            workingDigits[from] -= 1;
            workingDigits[to] += 10;
            borrowChain.push({
              from,
              to,
              fromPlaceName: PLACE_NAMES[from],
              toPlaceName: PLACE_NAMES[to],
              fromBefore,
              fromAfter: workingDigits[from],
              toBefore,
              toAfter: workingDigits[to]
            });
          }
        }

        const afterBorrowValue = workingDigits[place];
        const resultDigit = afterBorrowValue - subtrahendValue;
        resultDigits[place] = resultDigit;

        steps.push({
          place,
          placeName: PLACE_NAMES[place],
          beforeBorrowValue,
          subtrahendValue,
          needBorrow,
          borrowChain,
          afterBorrowValue,
          resultDigit,
          workingDigitsBefore,
          workingDigitsAfterBorrow: workingDigits.slice()
        });
      }

      return {
        minuendDigits,
        subtrahendDigits,
        steps,
        resultDigits,
        answer: minuend - subtrahend
      };
    }

    function createInitialState(minuend, subtrahend) {
      return {
        minuend,
        subtrahend,
        model: computeSubtractionSteps(minuend, subtrahend),
        currentPlace: 0,
        phase: "judge",
        selectedJudgement: {},
        judgementResults: {},
        inputAnswers: {},
        revealedAnswers: {},
        completedPlaces: {},
        calculationResults: {},
        animatedCrossPlaces: {},
        pendingCrossPlaces: {},
        borrowAnimationPending: false,
        borrowAnimationRunning: false,
        history: [],

        headerMessageType: "",
        stepMessage: "",
        stepMessageType: "",
        horizontalAnswer: "",
        answerCheckMessage: "",
        answerCheckType: ""
      };
    }

    function snapshotState() {
      const copy = cloneData(appState);
      copy.history = [];
      return copy;
    }

    function pushHistory() {
      appState.history.push(snapshotState());
    }

    function getCurrentStep() {
      return appState.model.steps[appState.currentPlace];
    }

    function getVisibleWorkingDigits() {
      if (appState.phase === "complete") {
        return appState.model.steps[2].workingDigitsAfterBorrow.slice();
      }

      const step = getCurrentStep();
      if (appState.phase === "borrowExplanation" || appState.phase === "calculate") {
        return step.workingDigitsAfterBorrow.slice();
      }

      return step.workingDigitsBefore.slice();
    }

    function getActiveBorrowChain() {
      return [];
    }

    function hasBorrowDisplayChange(visibleDigits, minuendDigits = appState.model.minuendDigits) {
      return visibleDigits.some((value, place) => value !== minuendDigits[place]);
    }

    function getPhaseLabel() {
      if (appState.phase === "judge") {
        return "判斷";
      }
      if (appState.phase === "borrowExplanation") {
        return "借位";
      }
      if (appState.phase === "calculate") {
        return "計算";
      }
      return "完成";
    }

    function clampProblemValue(value) {
      const number = Number.parseInt(value, 10);
      if (Number.isNaN(number)) {
        return 0;
      }
      return Math.min(999, Math.max(0, number));
    }

    function renderAll() {
      borrowAnimationToken += 1;
      renderProblemHeader();
      renderBeadColumns();
      renderVerticalSubtraction();
      renderStepPanel();
      renderFocusState();
      flushPendingCrossAnimations();
    }

    function renderProblemHeader() {
      const header = document.getElementById("problemHeader");
      const feedbackClass = appState.headerMessageType ? " " + appState.headerMessageType : "";
      const answerFeedback = appState.answerCheckMessage
        ? `<div class="feedback-line ${appState.answerCheckType}">${appState.answerCheckMessage}</div>`
        : "";

      header.innerHTML = `
        <div class="title-row">
          <h1>減法借位小達人</h1>
          <div class="equation-badge">${appState.minuend} - ${appState.subtrahend} = ?</div>

        <div class="controls" aria-label="題目設定區">
          <div class="field">
            <label for="minuendInput">被減數</label>
            <input id="minuendInput" type="number" min="0" max="999" value="${appState.minuend}">
          </div>
          <div class="field">
            <label for="subtrahendInput">減數</label>
            <input id="subtrahendInput" type="number" min="0" max="999" value="${appState.subtrahend}">

      document.getElementById("startButton").addEventListener("click", handleStart);

    function renderBeadColumns() {
      const wrapper = document.getElementById("beadColumns");
      const borrowStep = getCurrentStep();
      const shouldPlayBorrowAnimation = borrowStep && borrowStep.needBorrow &&
        (appState.phase === "borrowExplanation" || appState.borrowAnimationPending);
      if (shouldPlayBorrowAnimation && !appState.borrowAnimationRunning) {
        appState.borrowAnimationRunning = true;
        const startingDigits = borrowStep.workingDigitsBefore.slice();
        renderBorrowStage(startingDigits);
        const token = borrowAnimationToken;
        window.setTimeout(() => startBorrowAnimation(borrowStep.borrowChain, startingDigits, token), 0);
        return;
      }
      const visibleDigits = getVisibleWorkingDigits();
      const activeBorrowChain = getActiveBorrowChain();

      wrapper.innerHTML = DISPLAY_PLACES.map((place) => {
        const count = visibleDigits[place];
        const incomingBorrows = activeBorrowChain.filter((item) => item.to === place);
        const outgoingBorrows = activeBorrowChain.filter((item) => item.from === place);
        const outgoingBorrowCount = outgoingBorrows.length;
        const visualCount = count + outgoingBorrowCount;
        const isFocus = appState.phase !== "complete" && appState.currentPlace === place;
        const isDone = Boolean(appState.completedPlaces[place]);
        const className = [
          "bead-column",
          isFocus ? "focus" : "",
          !isFocus && !isDone ? "dim" : "",
          !isFocus && isDone ? "done" : ""
        ].filter(Boolean).join(" ");
        const step = appState.model.steps[place];
        const shouldShowSubtractionCrosses = appState.completedPlaces[place] ||
          Object.prototype.hasOwnProperty.call(appState.revealedAnswers, place) ||
          (appState.phase === "calculate" && appState.currentPlace === place);
        const crossedCount = shouldShowSubtractionCrosses
          ? Math.min(count, step.subtrahendValue)
          : 0;
        const firstCrossedIndex = visualCount - crossedCount;
        const beads = visualCount > 0
          ? Array.from({ length: visualCount }, (_, beadIndex) => {
              const incomingBorrow = incomingBorrows.find((item) => beadIndex >= item.toBefore && beadIndex < item.toBefore + 10);
              const isBorrowedIn = Boolean(incomingBorrow);
              const borrowedAwayIndex = beadIndex - (visualCount - outgoingBorrowCount);
              const outgoingBorrow = borrowedAwayIndex >= 0 ? outgoingBorrows[borrowedAwayIndex] : null;
              const isBorrowedAway = Boolean(outgoingBorrow);
              const isCrossed = !isBorrowedAway && beadIndex >= firstCrossedIndex;
              const crossOrder = count - 1 - beadIndex;
              const beadClasses = ["bead", PLACE_CLASSES[place]];
              const beadAttributes = [];
              if (isBorrowedIn) {
                beadClasses.push("borrowed-in");
                beadAttributes.push(`data-borrow-target="${activeBorrowChain.indexOf(incomingBorrow)}"`);
              }
              if (isBorrowedAway) {
                beadClasses.push("borrowed-away");
                beadAttributes.push(`data-borrow-source="${activeBorrowChain.indexOf(outgoingBorrow)}"`);
              }
              if (isCrossed) {
                beadClasses.push("crossed");
              }
              const crossData = isCrossed
                ? ` data-cross-order="${crossOrder}" style="--cross-delay: ${crossOrder * 100}ms;"`
                : "";
              return `<span class="${beadClasses.join(" ")}"${beadAttributes.length ? " " + beadAttributes.join(" ") : ""}${crossData}></span>`;
            }).join("")
          : "";

        return `
          <div class="${className}" data-place="${place}">
            <div class="bead-label">
              ${PLACE_NAMES[place]}
              <span class="bead-count">${count} 顆</span>
            </div>
            <div class="rod">${beads}</div>
          </div>
        `;
      }).join("");

      renderBorrowArrows(activeBorrowChain);
    }

    function renderBorrowStage(digits, splitPlace = null, reservedSlots = {}) {
      const wrapper = document.getElementById("beadColumns");
      wrapper.innerHTML = DISPLAY_PLACES.map((place) => {
        const count = digits[place];
        const slotCount = Math.max(count, reservedSlots[place] || 0);
        const isFocus = appState.phase !== "complete" && appState.currentPlace === place;
        const isDone = Boolean(appState.completedPlaces[place]);
        const className = ["bead-column", isFocus ? "focus" : "", !isFocus && !isDone ? "dim" : "", !isFocus && isDone ? "done" : ""].filter(Boolean).join(" ");
        const beads = Array.from({ length: count }, (_, index) => `<span class="bead ${PLACE_CLASSES[place]}${splitPlace === place && index >= count - 10 ? " borrow-split" : ""}"></span>`).join("");
        const slots = Array.from({ length: slotCount - count }, () => `<span class="bead bead-slot ${PLACE_CLASSES[place]}"></span>`).join("");
        return `<div class="${className}" data-place="${place}"><div class="bead-label">${PLACE_NAMES[place]}<span class="bead-count">${count} 顆</span></div><div class="rod" style="--bead-slot-count: ${slotCount};">${beads}${slots}</div></div>`;
      }).join("");
    }

    function startBorrowAnimation(chain, startingDigits, token) {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const stagedDigits = startingDigits.slice();
      const runStage = (index) => {
        if (token !== borrowAnimationToken) {
          return;
        }
        if (index >= chain.length) {
          appState.borrowAnimationPending = false;
          appState.borrowAnimationRunning = false;
          return;
        }
        const item = chain[index];
        if (reducedMotion) {
          stagedDigits[item.from] -= 1;
          stagedDigits[item.to] += 10;
          renderBorrowStage(stagedDigits, item.to);
          window.setTimeout(() => runStage(index + 1), 0);
          return;
        }

        renderBorrowStage(stagedDigits, null, { [item.to]: item.toAfter });
        const wrapper = document.getElementById("beadColumns");
        const source = wrapper.querySelector(`[data-place="${item.from}"] .bead:last-child`);
        const targetSlots = Array.from(wrapper.querySelectorAll(`[data-place="${item.to}"] .bead-slot`));
        if (!source || targetSlots.length !== 10) {
          renderBorrowStage(getCurrentStep().workingDigitsAfterBorrow.slice());
          appState.borrowAnimationPending = false;
          appState.borrowAnimationRunning = false;
          return;
        }

        const wrapperRect = wrapper.getBoundingClientRect();
        const sourceRect = source.getBoundingClientRect();
        const startX = sourceRect.left + sourceRect.width / 2 - wrapperRect.left;
        const startY = sourceRect.top + sourceRect.height / 2 - wrapperRect.top;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "borrow-arrow-layer");
        svg.setAttribute("viewBox", `0 0 ${wrapperRect.width} ${wrapperRect.height}`);
        svg.setAttribute("aria-hidden", "true");
        const fanBeads = targetSlots.map((slot, branchIndex) => {
          const slotRect = slot.getBoundingClientRect();
          const endX = slotRect.left + slotRect.width / 2 - wrapperRect.left;
          const targetY = slotRect.top + slotRect.height / 2 - wrapperRect.top;
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          const curveX = startX + (endX - startX) * 0.48;
          path.setAttribute("class", "borrow-branch-line");
          path.setAttribute("d", `M ${startX} ${startY} Q ${curveX} ${(startY + targetY) / 2 - 26} ${endX} ${targetY}`);
          svg.appendChild(path);
          const bead = document.createElement("span");
          bead.className = `borrow-fan-bead ${PLACE_CLASSES[item.to]}`;
          bead.style.setProperty("--fan-order", branchIndex);
          bead.style.left = `${startX - sourceRect.width / 2}px`;
          bead.style.top = `${startY - sourceRect.height / 2}px`;
          return { bead, targetX: endX, targetY };
        });
        wrapper.append(svg, ...fanBeads.map(({ bead }) => bead));
        source.classList.add("borrow-source-active");
        window.requestAnimationFrame(() => {
          fanBeads.forEach(({ bead, targetX, targetY }) => {
            bead.style.left = `${targetX - sourceRect.width / 2}px`;
            bead.style.top = `${targetY - sourceRect.height / 2}px`;
            bead.classList.add("fan-active");
          });
        });

        window.setTimeout(() => {
          if (token !== borrowAnimationToken) {
            return;
          }
          stagedDigits[item.from] -= 1;
          stagedDigits[item.to] += 10;
          renderBorrowStage(stagedDigits, item.to);
          window.setTimeout(() => {
            window.setTimeout(() => runStage(index + 1), 900);
          }, 800);
        }, 2300);
      };
      runStage(0);
    }

    function renderBorrowArrows(activeBorrowChain) {
      const wrapper = document.getElementById("beadColumns");
      if (!activeBorrowChain.length) {
        return;
      }

      const wrapperRect = wrapper.getBoundingClientRect();
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "borrow-arrow-layer");
      svg.setAttribute("viewBox", `0 0 ${wrapperRect.width} ${wrapperRect.height}`);
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");

      activeBorrowChain.forEach((_, borrowIndex) => {
        const source = wrapper.querySelector(`[data-borrow-source="${borrowIndex}"]`);
        const targets = Array.from(wrapper.querySelectorAll(`[data-borrow-target="${borrowIndex}"]`));
        if (!source || !targets.length) {
          return;
        }

        const sourceRect = source.getBoundingClientRect();
        const sourceCenterX = sourceRect.left + sourceRect.width / 2 - wrapperRect.left;
        const sourceCenterY = sourceRect.top + sourceRect.height / 2 - wrapperRect.top;
        const startPoint = {
          x: sourceRect.left + sourceRect.width * 0.55 - wrapperRect.left,
          y: sourceRect.top + sourceRect.height / 2 - wrapperRect.top
        };

        const ring = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        ring.setAttribute("class", "borrow-source-ring");
        ring.setAttribute("cx", sourceCenterX);
        ring.setAttribute("cy", sourceCenterY);
        ring.setAttribute("rx", sourceRect.width * 0.78);
        ring.setAttribute("ry", sourceRect.height * 1.42);
        svg.appendChild(ring);

        const sortedTargets = targets
          .map((target) => {
            const targetRect = target.getBoundingClientRect();
            return {
              element: target,
              rect: targetRect,
              centerY: targetRect.top + targetRect.height / 2
            };
          })
          .sort((a, b) => a.centerY - b.centerY);

        sortedTargets.forEach((targetInfo, index) => {
          const targetRect = targetInfo.rect;
          const targetPoint = {
            x: targetRect.left - 6 - wrapperRect.left,
            y: targetRect.top + targetRect.height / 2 - wrapperRect.top
          };
          const arrow = createBorrowArrowPath(startPoint, targetPoint, index, sortedTargets.length);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("class", "borrow-arrow-line");
          path.setAttribute("d", arrow.pathD);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", "#D81B60");
          path.setAttribute("stroke-width", "1.8");
          path.setAttribute("stroke-linecap", "round");
          path.setAttribute("stroke-linejoin", "round");
          path.setAttribute("opacity", "0.9");
          svg.appendChild(path);

          const arrowHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          arrowHead.setAttribute("class", "borrow-arrow-head");
          arrowHead.setAttribute("points", getArrowHeadPoints(arrow.tip, arrow.controlPoint, 8));
          arrowHead.setAttribute("fill", "#D81B60");
          arrowHead.setAttribute("opacity", "0.9");
          svg.appendChild(arrowHead);
        });
      });

      wrapper.appendChild(svg);
    }

    function createBorrowArrowPath(start, target, index, total) {
      const startX = start.x;
      const startY = start.y;
      const endX = target.x;
      const endY = target.y;
      const dx = endX - startX;
      const fanOffset = (index - (total - 1) / 2) * 2.5;
      const c1x = startX + dx * 0.32;
      const c1y = startY + fanOffset;
      const c2x = endX - Math.max(28, Math.abs(dx) * 0.22);
      const c2y = endY;
      const arrowSize = 8;
      const angle = Math.atan2(endY - c2y, endX - c2x);
      const pathEndX = endX - Math.cos(angle) * arrowSize * 0.75;
      const pathEndY = endY - Math.sin(angle) * arrowSize * 0.75;

      return {
        pathD: `M ${startX} ${startY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${pathEndX} ${pathEndY}`,
        tip: { x: endX, y: endY },
        controlPoint: { x: c2x, y: c2y }
      };
    }

    function getArrowHeadPoints(end, controlPoint, size = 8) {
      const angle = Math.atan2(end.y - controlPoint.y, end.x - controlPoint.x);
      const tip = {
        x: end.x,
        y: end.y
      };
      const back = {
        x: end.x - Math.cos(angle) * size,
        y: end.y - Math.sin(angle) * size
      };
      const normal = {
        x: -Math.sin(angle),
        y: Math.cos(angle)
      };
      const halfWidth = size * 0.45;
      const p1 = {
        x: back.x + normal.x * halfWidth,
        y: back.y + normal.y * halfWidth
      };
      const p2 = {
        x: back.x - normal.x * halfWidth,
        y: back.y - normal.y * halfWidth
      };

      return `${tip.x},${tip.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`;
    }

    function flushPendingCrossAnimations() {
      const pending = appState.pendingCrossPlaces || {};
      Object.keys(pending).forEach((place) => {
        if (pending[place]) {
          triggerCrossAnimation(Number(place));
        }
      });
      appState.pendingCrossPlaces = {};
    }

    function triggerCrossAnimation(place) {
      if (!appState.animatedCrossPlaces) {
        appState.animatedCrossPlaces = {};
      }
      if (appState.animatedCrossPlaces[place]) {
        return;
      }

      const column = document.querySelector(`.bead-column[data-place="${place}"]`);
      if (!column) {
        return;
      }

      const crossedBeads = Array.from(column.querySelectorAll(".bead.crossed"))
        .sort((a, b) => Number(a.dataset.crossOrder || 0) - Number(b.dataset.crossOrder || 0));

      appState.animatedCrossPlaces[place] = true;
      crossedBeads.forEach((bead, index) => {
        bead.style.setProperty("--cross-delay", `${index * 100}ms`);
        bead.classList.add("cross-animate");
      });

      window.setTimeout(() => {
        crossedBeads.forEach((bead) => bead.classList.remove("cross-animate"));
      }, crossedBeads.length * 100 + 260);
    }

    function renderVerticalSubtraction() {
      const wrapper = document.getElementById("verticalSubtraction");
      const visibleDigits = getVisibleWorkingDigits();
      const borrowRow = hasBorrowDisplayChange(visibleDigits)
        ? `
          <tr class="borrow-row">
            <td class="row-label">借位後</td>
            ${DISPLAY_PLACES.map((place) => `<td class="${cellClass(place)}">${visibleDigits[place]}</td>`).join("")}
          </tr>
        `
        : "";

      function cellClass(place, extraClass) {
        const classes = ["digit-cell"];
        if (extraClass) {
          classes.push(extraClass);
        }
        if (appState.phase !== "complete" && appState.currentPlace === place) {
          classes.push("focus");
        } else if (!appState.completedPlaces[place]) {
          classes.push("dim");
        }
        return classes.join(" ");
      }

      function originalCellClass(place) {
        const classes = [cellClass(place)];
        if (appState.model.minuendDigits[place] !== visibleDigits[place]) {
          classes.push("original-changed");
        }
        return classes.join(" ");
      }

      function answerValue(place) {
        if (Object.prototype.hasOwnProperty.call(appState.revealedAnswers, place)) {
          return appState.revealedAnswers[place];
        }
        return appState.inputAnswers[place] || "";
      }

      wrapper.innerHTML = `
        <table class="vertical-table" aria-label="直式">
          <tr>
            <th></th>
            ${DISPLAY_PLACES.map((place) => `<th>${PLACE_SHORT[place]}</th>`).join("")}
          </tr>
          ${borrowRow}
          <tr class="original-row">
            <td class="row-label">原數字</td>
            ${DISPLAY_PLACES.map((place) => `<td class="${originalCellClass(place)}">${appState.model.minuendDigits[place]}</td>`).join("")}
          </tr>
          <tr>
            <td class="row-label minus-sign">-</td>
            ${DISPLAY_PLACES.map((place) => `<td class="${cellClass(place)}">${appState.model.subtrahendDigits[place]}</td>`).join("")}
          </tr>
          <tr>
            <td class="row-label">答案</td>
            ${DISPLAY_PLACES.map((place) => `
              <td class="${cellClass(place, "answer-cell")}">
                <input class="answer-digit" data-answer-place="${place}" inputmode="numeric" maxlength="1" value="${answerValue(place)}" ${appState.completedPlaces[place] ? "readonly" : ""} aria-label="${PLACE_NAMES[place]}答案">
              </td>
            `).join("")}
          </tr>
        </table>
      `;

      wrapper.querySelectorAll("[data-answer-place]").forEach((input) => {
        input.addEventListener("input", (event) => {
          const place = event.target.getAttribute("data-answer-place");
          const cleanValue = event.target.value.replace(/\D/g, "").slice(0, 1);
          event.target.value = cleanValue;
          appState.inputAnswers[place] = cleanValue;
        });
      });
    }

    function renderStepPanel() {
      const panel = document.getElementById("stepPanel");

      panel.innerHTML = `
        <div class="panel-title">
          <h2>步驟判斷區</h2>
          <span class="small-note">${getPhaseLabel()}</span>
        </div>
        <div class="step-list">
          ${appState.model.steps.map((step) => renderSingleStep(step)).join("")}
        </div>
      `;

      panel.querySelectorAll("[data-judgement]").forEach((button) => {
        button.addEventListener("click", (event) => {
          const value = event.currentTarget.getAttribute("data-judgement") === "true";
          handleJudgementChoice(value);
        });
      });

      const confirmButton = panel.querySelector("[data-confirm-digit]");
      if (confirmButton) {
        confirmButton.addEventListener("click", confirmCurrentDigitAnswer);
      }

      const calcInput = panel.querySelector("[data-calc-input]");
      if (calcInput) {
        calcInput.addEventListener("input", (event) => {
          const cleanValue = event.target.value.replace(/\D/g, "").slice(0, 1);
          event.target.value = cleanValue;
          appState.inputAnswers[appState.currentPlace] = cleanValue;
          const verticalInput = document.querySelector(`[data-answer-place="${appState.currentPlace}"]`);
          if (verticalInput) {
            verticalInput.value = cleanValue;
          }
        });
      }
    }

    function renderSingleStep(step) {
      const place = step.place;
      const isCurrent = appState.phase !== "complete" && appState.currentPlace === place;
      const isCompleted = Boolean(appState.completedPlaces[place]);
      const className = [
        "step-card",
        isCurrent ? "current" : "",
        isCompleted ? "completed" : "",
        !isCurrent && !isCompleted ? "collapsed" : ""
      ].filter(Boolean).join(" ");
      const tick = isCompleted ? `<span class="tick">✓</span>` : "";

      if (!isCurrent) {
        return `
          <div class="${className}">
            <div class="step-head">
              <h3>${step.placeName}</h3>
              ${tick || `<span class="phase-pill">未處理</span>`}
            </div>
          </div>
        `;
      }

      return `
        <div class="${className}">
          <div class="step-head">
            <h3>${step.placeName}</h3>
            <span class="phase-pill">${getPhaseLabel()}</span>
          </div>
          <div class="step-body">
            ${renderCurrentStepBody(step)}
          </div>
        </div>
      `;
    }

    function renderCurrentStepBody(step) {
      if (appState.phase === "judge") {
        return renderJudgeBody(step);
      }
      if (appState.phase === "borrowExplanation") {
        return renderBorrowBody(step);
      }
      if (appState.phase === "calculate") {
        return renderCalculateBody(step);
      }
      return `<div class="message ok">全部完成！可以檢查橫式答案。</div>`;
    }

    function renderJudgeBody(step) {
      const selected = appState.selectedJudgement[step.place];
      const result = appState.judgementResults[step.place];
      const message = appState.stepMessage
        ? `<div class="message ${appState.stepMessageType}">${appState.stepMessage}</div>`
        : `<div class="message">看看 ${step.beforeBorrowValue} 夠不夠減 ${step.subtrahendValue}。</div>`;

      function buttonClass(value) {
        const classes = ["choice-button"];
        if (selected === value) {
          classes.push("selected");
          if (result === "correct") {
            classes.push("correct");
          }
          if (result === "wrong") {
            classes.push("wrong");
          }
        }
        return classes.join(" ");
      }

      const tick = result === "correct" ? `<span class="tick">✓</span>` : "";

      return `
        <div class="message">判斷：${step.beforeBorrowValue} - ${step.subtrahendValue}</div>
        <div class="choice-row">
          <button class="${buttonClass(true)}" type="button" data-judgement="true">需要借位</button>
          <button class="${buttonClass(false)}" type="button" data-judgement="false">不需要借位</button>
          ${tick}
        </div>
        ${message}
      `;
    }

    function renderBorrowBody(step) {
      const chainText = step.borrowChain.map((item) => `
        <span class="borrow-chip">
          ${item.fromPlaceName} ${item.fromBefore}→${item.fromAfter}
          <span class="arrow">➜</span>
          ${item.toPlaceName} ${item.toBefore}→${item.toAfter}
        </span>
      `).join("");

      const explanation = step.borrowChain.length > 1
        ? "連續借位：中間位值不夠借，先向更高位借，再往目前位值傳下來。"
        : "普通借位：目前位值不夠減，向左邊位值借 1。";

      return `
        <div class="borrow-box">
          <div>${explanation}</div>
          <div class="borrow-chain">${chainText}</div>
          <div>${step.placeName} 借位後變成 ${step.afterBorrowValue}，接著可以計算。</div>
        </div>
        <div class="message ok">借位後數值已更新到算柱和直式。</div>
      `;
    }

    function renderCalculateBody(step) {
      const storedInput = appState.inputAnswers[step.place] || "";
      const calculationResult = appState.calculationResults[step.place];
      const revealed = appState.revealedAnswers[step.place];
      const message = appState.stepMessage
        ? `<div class="message ${appState.stepMessageType}">${appState.stepMessage}</div>`
        : `<div class="message">輸入這一位的答案，或直接按下一步。</div>`;
      const tick = calculationResult === "correct" ? `<span class="tick">✓</span>` : "";
      const revealedText = Object.prototype.hasOwnProperty.call(appState.revealedAnswers, step.place)
        ? `<div class="message ok">正確答案：${revealed}</div>`
        : "";

      return `
        <div class="calc-row">
          <strong>${step.afterBorrowValue} - ${step.subtrahendValue} =</strong>
          <input data-calc-input inputmode="numeric" maxlength="1" value="${storedInput}" aria-label="${step.placeName}計算答案">
          <button type="button" data-confirm-digit>確認</button>
          ${tick}
        </div>
        ${message}
        ${revealedText}
      `;
    }

    function renderFocusState() {
      document.body.setAttribute("data-current-place", String(appState.currentPlace));
      document.body.setAttribute("data-phase", appState.phase);
      const previous = document.getElementById("previousButton");
      const next = document.getElementById("nextButton");
      previous.disabled = appState.history.length === 0;
      next.disabled = appState.phase === "complete";
      next.textContent = appState.phase === "complete" ? "已完成" : "下一步";
    }

    function handleStart() {
      const minuend = clampProblemValue(document.getElementById("minuendInput").value);
      const subtrahend = clampProblemValue(document.getElementById("subtrahendInput").value);

      if (minuend < subtrahend) {
        showError("目前只支援答案不為負數的減法，請輸入被減數 ≥ 減數。");
        return;
      }

      appState = createInitialState(minuend, subtrahend);
      renderAll();
    }

    function handleNext() {
      if (appState.phase === "complete") {
        return;
      }

      const step = getCurrentStep();

      if (appState.phase === "judge") {
        const selected = appState.selectedJudgement[step.place];
        if (selected !== true && selected !== false) {
          appState.stepMessage = "請先選擇需要借位或不需要借位。";
          appState.stepMessageType = "error";
          renderAll();
          return;
        }
        if (selected !== step.needBorrow) {
          appState.stepMessage = "這個判斷還不對，請再試一次。";
          appState.stepMessageType = "error";
          appState.judgementResults[step.place] = "wrong";
          renderAll();
          return;
        }

        pushHistory();
        appState.stepMessage = "";
        appState.stepMessageType = "";
        appState.borrowAnimationPending = step.needBorrow;
        appState.borrowAnimationRunning = false;
        appState.phase = "calculate";
        renderAll();
        return;
      }

      if (appState.phase === "borrowExplanation") {
        pushHistory();
        appState.phase = "calculate";
        appState.stepMessage = "";
        appState.stepMessageType = "";
        renderAll();
        return;
      }

      if (appState.phase === "calculate") {
        pushHistory();
        finalizeCurrentCalculation(true);
        moveToNextPlace();
        renderAll();
      }
    }

    function handlePrevious() {
      if (!appState.history.length) {
        return;
      }
      const previousState = appState.history.pop();
      const remainingHistory = appState.history;
      appState = previousState;
      appState.history = remainingHistory;
      renderAll();
    }

    function handleJudgementChoice(needsBorrow) {
      const step = getCurrentStep();
      if (appState.phase !== "judge") {
        return;
      }

      pushHistory();
      appState.selectedJudgement[step.place] = needsBorrow;
      if (needsBorrow === step.needBorrow) {
        appState.judgementResults[step.place] = "correct";
        appState.stepMessage = "判斷正確！";
        appState.stepMessageType = "ok";
      } else {
        appState.judgementResults[step.place] = "wrong";
        appState.stepMessage = step.needBorrow
          ? "目前位值不夠減，需要借位。"
          : "目前位值已經夠減，不需要借位。";
        appState.stepMessageType = "error";
      }
      renderAll();
    }

    function handleAnswerCheck() {
      const input = document.getElementById("horizontalAnswerInput");
      const value = Number.parseInt(input.value, 10);
      appState.horizontalAnswer = input.value;

      if (Number.isNaN(value)) {
        appState.answerCheckMessage = "請先輸入橫式答案。";
        appState.answerCheckType = "error";
      } else if (value === appState.model.answer) {
        appState.answerCheckMessage = "答對了！";
        appState.answerCheckType = "ok";
      } else {
        appState.answerCheckMessage = `再檢查一次。正確答案是 ${appState.model.answer}。`;
        appState.answerCheckType = "error";
      }

      renderAll();
    }

    function showError(message) {
      appState.headerMessage = message;
      appState.headerMessageType = "error";
      renderAll();
    }

    function confirmCurrentDigitAnswer() {
      if (appState.phase !== "calculate") {
        return;
      }
      pushHistory();
      finalizeCurrentCalculation(false);
      renderAll();
    }

    function finalizeCurrentCalculation(isAutoAdvance) {
      const step = getCurrentStep();
      const rawValue = appState.inputAnswers[step.place];
      const hasInput = rawValue !== undefined && rawValue !== "";
      const numberValue = Number.parseInt(rawValue, 10);
      const isCorrect = hasInput && numberValue === step.resultDigit;

      appState.revealedAnswers[step.place] = step.resultDigit;
      appState.completedPlaces[step.place] = true;
      if (!appState.animatedCrossPlaces[step.place]) {
        appState.pendingCrossPlaces[step.place] = true;
      }

      if (isCorrect) {
        appState.calculationResults[step.place] = "correct";
        appState.stepMessage = "計算正確！";
        appState.stepMessageType = "ok";
      } else if (!hasInput && isAutoAdvance) {
        appState.calculationResults[step.place] = "auto";
        appState.stepMessage = `沒有輸入也沒關係，這一位是 ${step.resultDigit}。`;
        appState.stepMessageType = "ok";
      } else {
        appState.calculationResults[step.place] = "wrong";
        appState.stepMessage = `這一位的正確答案是 ${step.resultDigit}。`;
        appState.stepMessageType = "error";
      }
    }

    function moveToNextPlace() {
      if (appState.currentPlace < 2) {
        appState.currentPlace += 1;
        appState.phase = "judge";
        appState.stepMessage = "";
        appState.stepMessageType = "";
        appState.headerMessage = `請繼續判斷${PLACE_NAMES[appState.currentPlace]}。`;
        appState.headerMessageType = "";
      } else {
        appState.phase = "complete";
        appState.headerMessage = `完成！${appState.minuend} - ${appState.subtrahend} = ${appState.model.answer}`;
        appState.headerMessageType = "ok";
        appState.stepMessage = "全部完成！";
        appState.stepMessageType = "ok";
      }
    }

    function runTests() {
      const cases = [
        { minuend: 817, subtrahend: 725, answer: 92 },
        { minuend: 91, subtrahend: 5, answer: 86 },
        { minuend: 100, subtrahend: 11, answer: 89 },
        { minuend: 100, subtrahend: 1, answer: 99 },
        { minuend: 305, subtrahend: 178, answer: 127 },
        { minuend: 900, subtrahend: 456, answer: 444 },
        { minuend: 250, subtrahend: 89, answer: 161 },
        { minuend: 402, subtrahend: 39, answer: 363 }
      ];

      for (const testCase of cases) {
        const model = computeSubtractionSteps(testCase.minuend, testCase.subtrahend);
        const expectedDigits = toDigits(testCase.answer);

        if (model.answer !== testCase.answer) {
          console.error("TEST FAILED", { testCase, reason: "answer", model });
          return;
        }

        if (!arraysEqual(model.resultDigits, expectedDigits)) {
          console.error("TEST FAILED", { testCase, reason: "resultDigits", expectedDigits, model });
          return;
        }

        for (const step of model.steps) {
          if (step.resultDigit !== expectedDigits[step.place]) {
            console.error("TEST FAILED", { testCase, reason: "step resultDigit", step, expectedDigits });
            return;
          }
        }

        if (testCase.minuend === 100 && testCase.subtrahend === 11) {
          if (!arraysEqual(model.steps[0].workingDigitsAfterBorrow, [10, 9, 0])) {
            console.error("TEST FAILED", {
              testCase,
              reason: "100-11 workingDigitsAfterBorrow",
              actual: model.steps[0].workingDigitsAfterBorrow
            });
            return;
          }
        }

        if (testCase.minuend === 305 && testCase.subtrahend === 178) {
          if (!arraysEqual(model.steps[0].workingDigitsAfterBorrow, [15, 9, 2])) {
            console.error("TEST FAILED", {
              testCase,
              reason: "305-178 workingDigitsAfterBorrow",
              actual: model.steps[0].workingDigitsAfterBorrow
            });
            return;
          }
        }

        if (testCase.minuend === 817 && testCase.subtrahend === 725) {
          if (!arraysEqual(model.steps[1].workingDigitsAfterBorrow, [7, 11, 7])) {
            console.error("TEST FAILED", {
              testCase,
              reason: "817-725 tens borrow",
              actual: model.steps[1].workingDigitsAfterBorrow
            });
            return;
          }
        }

        if (testCase.minuend === 100 && testCase.subtrahend === 11) {
          if (hasBorrowDisplayChange(model.steps[0].workingDigitsBefore, model.minuendDigits)) {
            console.error("TEST FAILED", {
              testCase,
              reason: "borrow row should be hidden before borrow"
            });
            return;
          }

          if (!hasBorrowDisplayChange(model.steps[0].workingDigitsAfterBorrow, model.minuendDigits)) {
            console.error("TEST FAILED", {
              testCase,
              reason: "borrow row should show after borrow"
            });
            return;
          }
        }
      }

      console.log("ALL TESTS PASSED");
    }

    function initializeApp() {
      appState = createInitialState(100, 11);
      document.getElementById("previousButton").addEventListener("click", handlePrevious);
      document.getElementById("nextButton").addEventListener("click", handleNext);
      renderAll();
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        initLDLSourceReference();
        runTests();
        initializeApp();
      } catch (error) {
        console.error(error);
        document.body.classList.add("has-js-error");
      }
    });
  </script>
  <script src="../../assets/tool-home-nav.js"></script>
</body>
</html>
