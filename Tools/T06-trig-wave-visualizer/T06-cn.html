    const trailCheck = document.getElementById("trailCheck");
    const angleValue = document.getElementById("angleValue");
    const radianValue = document.getElementById("radianValue");
    const functionValue = document.getElementById("functionValue");
    const currentValue = document.getElementById("currentValue");
    const graphLegend = document.getElementById("graphLegend");
    const tabs = Array.from(document.querySelectorAll(".tab"));
    const speedButtons = Array.from(document.querySelectorAll(".speed-btn"));

    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function normalizeAngle(angle) {
      const normalized = ((Number(angle) % 360) + 360) % 360;
      return Math.abs(normalized - 360) < 0.000001 ? 0 : normalized;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) {
        return "無定義";
      }
      const rounded = Math.round(value * 1000) / 1000;
      const fixed = Object.is(rounded, -0) || Math.abs(rounded) < 0.0005 ? 0 : rounded;
      return fixed.toFixed(3);
    }

    function getPiLabel(angle) {
      const rounded = Math.round(normalizeAngle(angle) * 1000) / 1000;
      const common = {
        0: "0",
        30: "π/6",
        45: "π/4",
        60: "π/3",
        90: "π/2",
        120: "2π/3",
        135: "3π/4",
        150: "5π/6",
        180: "π",
        210: "7π/6",
        225: "5π/4",
        240: "4π/3",
        270: "3π/2",
        300: "5π/3",
        315: "7π/4",
        330: "11π/6"
      };
      const key = Object.keys(common).find(item => Math.abs(Number(item) - rounded) < 0.001);
      return key ? common[key] : "";
    }

    function calculateTrigValue(fn, angle) {
      const rad = degToRad(angle);
      const sinValue = Math.sin(rad);
      const cosValue = Math.cos(rad);

      if (fn === "sin") {
        return { value: Math.abs(sinValue) < 0.0000001 ? 0 : sinValue, undefined: false };
      }

      if (fn === "cos") {
        return { value: Math.abs(cosValue) < 0.0000001 ? 0 : cosValue, undefined: false };
      }

      if (Math.abs(cosValue) < 0.0001) {
        return { value: null, undefined: true };
      }

      const tanValue = sinValue / cosValue;
      return { value: Math.abs(tanValue) < 0.0000001 ? 0 : tanValue, undefined: false };
    }

    function resizeCanvasToDisplaySize(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function activeColor() {
      return colors[state.selectedFunction];
    }

    function updateFromAngle(rawAngle, options = {}) {
      const normalized = normalizeAngle(rawAngle);
      state.angle = normalized;

      angleSlider.value = normalized;
      if (!options.preserveInput) {
        angleInput.value = formatNumber(normalized);
      }
      angleValue.textContent = `${formatNumber(normalized)}°`;

      const piLabel = getPiLabel(normalized);
      const radians = formatNumber(degToRad(normalized));
      radianValue.textContent = piLabel ? `${radians}（${piLabel}）` : radians;

      const result = calculateTrigValue(state.selectedFunction, normalized);
      functionValue.textContent = functionLabels[state.selectedFunction];
      currentValue.textContent = result.undefined ? "無定義" : formatNumber(result.value);
      currentValue.classList.toggle("warn", result.undefined);
      graphLegend.textContent = `目前顯示：${functionLabels[state.selectedFunction]}`;

      updateCircle();
      updateGraph();
    }

    function updateCircle() {
      resizeCanvasToDisplaySize(circleCanvas);
      drawUnitCircle(circleCtx, circleCanvas);
    }

    function updateGraph() {
      resizeCanvasToDisplaySize(graphCanvas);
      graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
      drawGraphAxes(graphCtx, graphCanvas);
      drawFunctionCurve(graphCtx, graphCanvas);
      drawGraphCursor(graphCtx, graphCanvas);
    }

    function drawRoundedLabel(ctx, text, x, y, options = {}) {
      const paddingX = options.paddingX || 10;
      const paddingY = options.paddingY || 6;
      const radius = options.radius || 6;
      ctx.save();
      ctx.font = options.font || "700 18px Microsoft JhengHei, Arial";
      const metrics = ctx.measureText(text);
      const width = metrics.width + paddingX * 2;
      const height = (options.height || 30);
      const left = Math.min(Math.max(x, 8), ctx.canvas.width - width - 8);
      const top = Math.min(Math.max(y, 8), ctx.canvas.height - height - 8);
      ctx.beginPath();
      ctx.roundRect(left, top, width, height, radius);
      ctx.fillStyle = options.background || "#ffffff";
      ctx.fill();
      ctx.strokeStyle = options.border || colors.line;
      ctx.lineWidth = options.lineWidth || 2;
      ctx.stroke();
      ctx.fillStyle = options.color || colors.ink;
      ctx.textBaseline = "middle";
      ctx.fillText(text, left + paddingX, top + height / 2 + 1);
      ctx.restore();
    }

    function drawUnitCircle(ctx, canvas) {
      const width = canvas.width;
      const height = canvas.height;
      const minSide = Math.min(width, height);
      const centerX = width / 2;
      const centerY = height / 2;
      const scale = minSide * 0.34;
      const tick = scale * 0.04;
      const angleRad = degToRad(state.angle);
      const mathX = Math.cos(angleRad);
      const mathY = Math.sin(angleRad);
      const pointX = centerX + mathX * scale;
      const pointY = centerY - mathY * scale;
      const projectionColor = activeColor();
      const result = calculateTrigValue(state.selectedFunction, state.angle);

      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      for (let value = -1; value <= 1.01; value += 0.5) {
        const x = centerX + value * scale;
        const y = centerY - value * scale;
        ctx.beginPath();
        ctx.moveTo(x, centerY - scale * 1.18);
        ctx.lineTo(x, centerY + scale * 1.18);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(centerX - scale * 1.18, y);
        ctx.lineTo(centerX + scale * 1.18, y);
        ctx.stroke();
      }

      ctx.strokeStyle = colors.axis;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(centerX - scale * 1.25, centerY);
      ctx.lineTo(centerX + scale * 1.28, centerY);
      ctx.moveTo(centerX + scale * 1.22, centerY - tick * 2.2);
      ctx.lineTo(centerX + scale * 1.28, centerY);
      ctx.lineTo(centerX + scale * 1.22, centerY + tick * 2.2);
      ctx.moveTo(centerX, centerY + scale * 1.25);
      ctx.lineTo(centerX, centerY - scale * 1.28);
      ctx.moveTo(centerX - tick * 2.2, centerY - scale * 1.22);
      ctx.lineTo(centerX, centerY - scale * 1.28);
      ctx.lineTo(centerX + tick * 2.2, centerY - scale * 1.22);
      ctx.stroke();

      ctx.fillStyle = colors.axis;
      ctx.font = "700 18px Microsoft JhengHei, Arial";
      ctx.fillText("x", centerX + scale * 1.31, centerY + 6);
      ctx.fillText("y", centerX + 8, centerY - scale * 1.31);

      ctx.strokeStyle = colors.line;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(centerX, centerY, scale, 0, Math.PI * 2);
      ctx.stroke();

      if (state.showTrail && state.angle > 0.1) {
        ctx.strokeStyle = projectionColor;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(centerX, centerY, scale, 0, -angleRad, true);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = colors.point;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(pointX, pointY);
      ctx.stroke();

      ctx.setLineDash([8, 7]);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "#94a3b8";
      ctx.beginPath();
      ctx.moveTo(pointX, pointY);
      ctx.lineTo(pointX, centerY);
      ctx.moveTo(pointX, pointY);
      ctx.lineTo(centerX, pointY);
      ctx.stroke();
      ctx.setLineDash([]);

      if (state.selectedFunction === "sin") {
        drawProjectionSegment(ctx, pointX, centerY, pointX, pointY, projectionColor, "sin θ = y", pointX + 12, (pointY + centerY) / 2 - 16);
      } else if (state.selectedFunction === "cos") {
        drawProjectionSegment(ctx, centerX, pointY, pointX, pointY, projectionColor, "cos θ = x", (centerX + pointX) / 2 - 50, pointY - 38);
      } else {
        drawTangentProjection(ctx, centerX, centerY, scale, mathX, mathY, pointX, pointY, projectionColor, result);
      }

      ctx.strokeStyle = projectionColor;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, scale * 0.24, 0, -angleRad, true);
      ctx.stroke();

      const arcLabelX = centerX + Math.cos(-angleRad / 2) * scale * 0.34;
      const arcLabelY = centerY + Math.sin(-angleRad / 2) * scale * 0.34;
      drawRoundedLabel(ctx, `θ = ${formatNumber(state.angle)}°`, arcLabelX - 46, arcLabelY - 18, {
        background: "#ffffff",
        border: projectionColor,
        color: projectionColor,
        font: "800 17px Microsoft JhengHei, Arial"
      });

      ctx.fillStyle = colors.point;
      ctx.beginPath();
      ctx.arc(pointX, pointY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const pointLabel = `(${formatNumber(mathX)}, ${formatNumber(mathY)})`;
      drawRoundedLabel(ctx, pointLabel, pointX + 14, pointY - 42, {
        background: "#ffffff",
        border: colors.line,
        color: colors.ink,
        font: "700 16px Microsoft JhengHei, Arial"
      });

      const valueText = result.undefined ? "目前數值：無定義" : `目前數值：${formatNumber(result.value)}`;
      drawRoundedLabel(ctx, valueText, 18, 18, {
        background: result.undefined ? "#fff4f4" : "#ffffff",
        border: result.undefined ? colors.warn : projectionColor,
        color: result.undefined ? colors.warn : projectionColor,
        font: "800 20px Microsoft JhengHei, Arial",
        height: 34
      });

      drawRoundedLabel(ctx, "單位圓半徑 = 1", width - 172, height - 50, {
        background: "#ffffff",
        border: colors.line,
        color: colors.muted,
        font: "700 15px Microsoft JhengHei, Arial"
      });

      ctx.restore();
    }

    function drawProjectionSegment(ctx, x1, y1, x2, y2, color, label, labelX, labelY) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.88;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      drawRoundedLabel(ctx, label, labelX, labelY, {
        background: "#ffffff",
        border: color,
        color,
        font: "800 18px Microsoft JhengHei, Arial"
      });
      ctx.restore();
    }

    function drawTangentProjection(ctx, centerX, centerY, scale, mathX, mathY, pointX, pointY, color, result) {
      ctx.save();
      const tangentX = centerX + scale;
      const tanValue = result.undefined ? null : result.value;
      const cappedTan = result.undefined ? (mathY >= 0 ? 1.45 : -1.45) : Math.max(-1.45, Math.min(1.45, tanValue));
      const tangentY = centerY - cappedTan * scale;

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.6;
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(tangentX, centerY - scale * 1.5);
      ctx.lineTo(tangentX, centerY + scale * 1.5);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(tangentX, tangentY);
      ctx.stroke();

      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.86;
      ctx.beginPath();
      ctx.moveTo(tangentX, centerY);
      ctx.lineTo(tangentX, tangentY);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(tangentX, tangentY, 7, 0, Math.PI * 2);
      ctx.fill();

      const label = result.undefined ? "tan θ = y ÷ x：無定義" : `tan θ = y ÷ x = ${formatNumber(tanValue)}`;
      drawRoundedLabel(ctx, label, 18, ctx.canvas.height - 58, {
        background: result.undefined ? "#fff4f4" : "#ffffff",
        border: result.undefined ? colors.warn : color,
        color: result.undefined ? colors.warn : color,
        font: "800 18px Microsoft JhengHei, Arial",
        height: 34
      });

      drawRoundedLabel(ctx, "x 接近 0 時不能相除", tangentX - 96, tangentY - 44, {
        background: "#ffffff",
        border: colors.line,
        color: colors.muted,
        font: "700 14px Microsoft JhengHei, Arial",
        height: 28
      });

      ctx.restore();
    }

    function graphMetrics(canvas) {
      const padding = {
        left: Math.max(112, canvas.width * 0.105),
        right: Math.max(34, canvas.width * 0.04),
        top: Math.max(28, canvas.height * 0.06),
        bottom: Math.max(54, canvas.height * 0.1)
      };
      const plotWidth = canvas.width - padding.left - padding.right;
      const plotHeight = canvas.height - padding.top - padding.bottom;
      const yLimit = state.selectedFunction === "tan" ? 5 : 1;
      return { padding, plotWidth, plotHeight, yLimit };
    }

    function angleToX(angle, metrics) {
      return metrics.padding.left + (angle / 360) * metrics.plotWidth;
    }

    function valueToY(value, metrics) {
      const capped = Math.max(-metrics.yLimit, Math.min(metrics.yLimit, value));
      return metrics.padding.top + (metrics.yLimit - capped) / (metrics.yLimit * 2) * metrics.plotHeight;
    }

    function drawGraphAxes(ctx, canvas) {
      const metrics = graphMetrics(canvas);
      const { padding, plotWidth, plotHeight, yLimit } = metrics;
      const left = padding.left;
      const right = padding.left + plotWidth;
      const top = padding.top;
      const bottom = padding.top + plotHeight;
      const midY = valueToY(0, metrics);

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fbfdff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      ctx.font = "700 14px Microsoft JhengHei, Arial";
      ctx.fillStyle = colors.muted;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      const angleTicks = [0, 90, 180, 270, 360];
      angleTicks.forEach(tick => {
        const x = angleToX(tick, metrics);
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
        ctx.fillText(`${tick}°`, x, bottom + 12);
      });

      const yTicks = state.selectedFunction === "tan" ? [-5, -2.5, 0, 2.5, 5] : [-1, -0.5, 0, 0.5, 1];
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      yTicks.forEach(tick => {
        const y = valueToY(tick, metrics);
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
        ctx.fillText(formatNumber(tick), left - 10, y);
      });

      ctx.strokeStyle = colors.axis;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(left, bottom);
      ctx.lineTo(right, bottom);
      ctx.moveTo(left, top);
      ctx.lineTo(left, bottom);
      ctx.stroke();

      ctx.strokeStyle = "#8da0b8";
      ctx.lineWidth = 1.6;
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.moveTo(left, midY);
      ctx.lineTo(right, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      if (state.selectedFunction === "tan") {
        [90, 270].forEach(deg => {
          const x = angleToX(deg, metrics);
          ctx.strokeStyle = colors.warn;
          ctx.lineWidth = 1.6;
          ctx.setLineDash([7, 6]);
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = colors.warn;
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText("漸近線", x, top - 6);
        });
      }

      ctx.fillStyle = colors.axis;
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.font = "800 16px Microsoft JhengHei, Arial";
      ctx.fillText("角度 θ", right, canvas.height - 10);
      ctx.textBaseline = "middle";
      ctx.textAlign = "right";
      ctx.fillText("函數值", left - 58, midY);

      ctx.strokeStyle = colors.line;
      ctx.lineWidth = 1.4;
      ctx.strokeRect(left, top, plotWidth, plotHeight);
      ctx.restore();
    }

    function drawFunctionCurve(ctx, canvas) {
      const metrics = graphMetrics(canvas);
      const color = activeColor();
      const step = state.selectedFunction === "tan" ? 0.25 : 0.5;
      let drawing = false;
      let previousY = null;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();

      for (let angle = 0; angle <= 360.0001; angle += step) {
        const result = calculateTrigValue(state.selectedFunction, angle);
        const x = angleToX(angle, metrics);

        if (result.undefined) {
          drawing = false;
          previousY = null;
          continue;
        }

        const value = result.value;
        const y = valueToY(value, metrics);
        const clipped = Math.abs(value) > metrics.yLimit;
        const nearBreak = state.selectedFunction === "tan" && (
          Math.abs(Math.cos(degToRad(angle))) < 0.015 ||
          (previousY !== null && Math.abs(y - previousY) > metrics.plotHeight * 0.72)
        );

        if (!drawing || nearBreak) {
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }

        if (clipped) {
          drawing = false;
        }

        previousY = y;
      }

      ctx.stroke();

      if (state.showTrail) {
        ctx.globalAlpha = 0.2;
        ctx.lineWidth = 5;
        ctx.beginPath();
        let trailDrawing = false;
        let trailPreviousY = null;
        for (let angle = 0; angle <= state.angle; angle += step) {
          const result = calculateTrigValue(state.selectedFunction, angle);
          const x = angleToX(angle, metrics);
          if (result.undefined) {
            trailDrawing = false;
            trailPreviousY = null;
            continue;
          }
          const y = valueToY(result.value, metrics);
          const nearBreak = state.selectedFunction === "tan" && (
            Math.abs(Math.cos(degToRad(angle))) < 0.015 ||
            (trailPreviousY !== null && Math.abs(y - trailPreviousY) > metrics.plotHeight * 0.72)
          );
          if (!trailDrawing || nearBreak) {
            ctx.moveTo(x, y);
            trailDrawing = true;
          } else {
            ctx.lineTo(x, y);
          }
          trailPreviousY = y;
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawGraphCursor(ctx, canvas) {
      const metrics = graphMetrics(canvas);
      const x = angleToX(state.angle, metrics);
      const top = metrics.padding.top;
      const bottom = metrics.padding.top + metrics.plotHeight;
      const result = calculateTrigValue(state.selectedFunction, state.angle);
      const color = result.undefined ? colors.warn : activeColor();

      ctx.save();
      ctx.strokeStyle = result.undefined ? colors.warn : colors.cursor;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();
      ctx.setLineDash([]);

      if (result.undefined) {
        const warningY = top + metrics.plotHeight * 0.18;
        ctx.fillStyle = colors.softWarn;
        ctx.fillRect(metrics.padding.left, top, metrics.plotWidth, metrics.plotHeight);
        drawRoundedLabel(ctx, "無定義", x + 12, warningY, {
          background: "#fff4f4",
          border: colors.warn,
          color: colors.warn,
          font: "800 18px Microsoft JhengHei, Arial"
        });
      } else {
        const y = valueToY(result.value, metrics);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const label = `${functionLabels[state.selectedFunction]} = ${formatNumber(result.value)}`;
        drawRoundedLabel(ctx, label, x + 12, y - 38, {
          background: "#ffffff",
          border: color,
          color,
          font: "800 16px Microsoft JhengHei, Arial"
        });
      }

      drawRoundedLabel(ctx, `${formatNumber(state.angle)}°`, x - 36, bottom - 38, {
        background: "#ffffff",
        border: colors.line,
        color: colors.ink,
        font: "800 15px Microsoft JhengHei, Arial",
        height: 28
      });

      ctx.restore();
    }

    function startAnimation() {
      if (state.isPlaying) {
        return;
      }
      state.isPlaying = true;
      state.lastFrameTime = null;
      playPauseBtn.textContent = "暫停";

      const step = timestamp => {
        if (!state.isPlaying) {
          return;
        }
        if (state.lastFrameTime === null) {
          state.lastFrameTime = timestamp;
        }
        const elapsed = Math.min(0.05, (timestamp - state.lastFrameTime) / 1000);
        state.lastFrameTime = timestamp;
        const nextAngle = normalizeAngle(state.angle + speeds[state.speed] * elapsed);
        updateFromAngle(nextAngle);
        state.animationId = requestAnimationFrame(step);
      };

      state.animationId = requestAnimationFrame(step);
    }

    function stopAnimation() {
      state.isPlaying = false;
      playPauseBtn.textContent = "播放";
      if (state.animationId !== null) {
        cancelAnimationFrame(state.animationId);
        state.animationId = null;
      }
      state.lastFrameTime = null;
    }

    function canvasPointToAngle(event) {
      const rect = circleCanvas.getBoundingClientRect();
      const clientX = event.clientX;
      const clientY = event.clientY;
      const x = clientX - rect.left - rect.width / 2;
      const y = rect.height / 2 - (clientY - rect.top);
      return normalizeAngle(Math.atan2(y, x) * 180 / Math.PI);
    }

    function handleCirclePointer(event) {
      event.preventDefault();
      stopAnimation();
      updateFromAngle(canvasPointToAngle(event));
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        state.selectedFunction = tab.dataset.function;
        document.body.dataset.function = state.selectedFunction;
        tabs.forEach(item => item.setAttribute("aria-selected", String(item === tab)));
        updateFromAngle(state.angle);
      });
    });

    speedButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.speed = button.dataset.speed;
        speedButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      });
    });

    angleSlider.addEventListener("input", event => {
      stopAnimation();
      updateFromAngle(event.target.value);
    });

    angleInput.addEventListener("input", event => {
      const value = event.target.value.trim();
      if (value === "" || value === "-" || value === "." || value === "-.") {
        return;
      }
      stopAnimation();
      updateFromAngle(value, { preserveInput: true });
    });

    angleInput.addEventListener("change", event => {
      stopAnimation();
      updateFromAngle(event.target.value);
    });

    angleInput.addEventListener("blur", event => {
      if (event.target.value.trim() !== "") {
        updateFromAngle(event.target.value);
      }
    });

    angleInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        stopAnimation();
        updateFromAngle(angleInput.value);
        angleInput.blur();
      }
    });

    playPauseBtn.addEventListener("click", () => {
      if (state.isPlaying) {
        stopAnimation();
      } else {
        startAnimation();
      }
    });

    resetBtn.addEventListener("click", () => {
      stopAnimation();
      updateFromAngle(0);
    });

    trailCheck.addEventListener("change", event => {
      state.showTrail = event.target.checked;
      updateFromAngle(state.angle);
    });

    circleCanvas.addEventListener("pointerdown", event => {
      state.isDraggingPoint = true;
      circleCanvas.setPointerCapture(event.pointerId);
      handleCirclePointer(event);
    });

    circleCanvas.addEventListener("pointermove", event => {
      if (state.isDraggingPoint) {
        handleCirclePointer(event);
      }
    });

    circleCanvas.addEventListener("pointerup", event => {
      state.isDraggingPoint = false;
      circleCanvas.releasePointerCapture(event.pointerId);
    });

    circleCanvas.addEventListener("pointercancel", () => {
      state.isDraggingPoint = false;
    });

    window.addEventListener("resize", () => updateFromAngle(state.angle));

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        this.beginPath();
        this.moveTo(x + r, y);
        this.lineTo(x + width - r, y);
        this.quadraticCurveTo(x + width, y, x + width, y + r);
        this.lineTo(x + width, y + height - r);
        this.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        this.lineTo(x + r, y + height);
        this.quadraticCurveTo(x, y + height, x, y + height - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    updateFromAngle(0);
  </script>

  <script>
    (() => {
      "use strict";

      const root = document.querySelector("[data-tool-home-nav-root]") || document.documentElement;
      const homeLink = document.getElementById("tool-home-link");
      const enterFullscreenButton = document.getElementById("enterFullscreen");
      const exitFullscreenButton = document.getElementById("exitFullscreen");

      if (homeLink) {
        homeLink.textContent = "工具總覽";
        homeLink.href = "../../index.html";
        homeLink.target = "_top";
        homeLink.setAttribute("aria-label", "前往工具總覽");
      }

      async function enterFullscreen() {
        try {
          if (!document.fullscreenElement && root.requestFullscreen) {
            await root.requestFullscreen();
          }
        } catch (error) {
          if (enterFullscreenButton) enterFullscreenButton.style.filter = "grayscale(0.4)";
        }
      }

      async function exitFullscreen() {
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } catch (error) {
          if (exitFullscreenButton) exitFullscreenButton.style.filter = "grayscale(0.4)";
        }
      }

      if (enterFullscreenButton) enterFullscreenButton.addEventListener("click", enterFullscreen);
      if (exitFullscreenButton) exitFullscreenButton.addEventListener("click", exitFullscreen);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") exitFullscreen();
      });

      const record = Object.freeze({
        productName: "三角函數波形視覺化工具",
        productNameEn: "Trigonometric Wave Visualizer",
        productCode: "LDL-MATH-T06-2026-001",
        toolId: "t06-trig-wave-visualizer",
        moduleId: "ldl-t06-trig-wave-visualizer",
        company: "Yung Fu Chuen",
        author: "Yung Fu Chuen",
        releaseYear: 2026,
        version: "1.1.0",
        copyright: "© 2026 Yung Fu Chuen. All rights reserved.",
        license: "Free classroom use only. Redistribution, resale, cloning, re-hosting, modification, or derivative use without written permission is prohibited.",
        buildId: "LDL-MATH-T06-2026-001",
        fingerprint: "ldl-yfc-t06-trig-wave-visualizer-v1",
        markerSignature: "LDL-SOURCE-REFERENCE-v1.1::Yung-Fu-Chuen::2026::t06-trig-wave-visualizer"
      });

      function setCssCustomProperties() {
        const html = document.documentElement;
        html.style.setProperty("--ldl-product-name", JSON.stringify(record.productName));
        html.style.setProperty("--ldl-product-name-en", JSON.stringify(record.productNameEn));
        html.style.setProperty("--ldl-product-code", JSON.stringify(record.productCode));
        html.style.setProperty("--ldl-tool-id", JSON.stringify(record.toolId));
        html.style.setProperty("--ldl-module-id", JSON.stringify(record.moduleId));
        html.style.setProperty("--ldl-company", JSON.stringify(record.company));
        html.style.setProperty("--ldl-author", JSON.stringify(record.author));
        html.style.setProperty("--ldl-release-year", String(record.releaseYear));
        html.style.setProperty("--ldl-version", JSON.stringify(record.version));
        html.style.setProperty("--ldl-build-id", JSON.stringify(record.buildId));
        html.style.setProperty("--ldl-fingerprint", JSON.stringify(record.fingerprint));
      }

      function upsertMetaTags() {
        Object.entries({
          author: record.author,
          company: record.company,
          copyright: record.copyright,
          license: record.license,
          "ldl-product-name": record.productName,
          "ldl-product-name-en": record.productNameEn,
          "ldl-product-code": record.productCode,
          "ldl-tool-id": record.toolId,
          "ldl-module-id": record.moduleId,
          "ldl-release-year": String(record.releaseYear),
          "ldl-version": record.version,
          "ldl-build-id": record.buildId,
          "ldl-fingerprint": record.fingerprint,
          "ldl-source-reference": `LDL Source Reference ${record.version} - ${record.company} - ${record.author}`
        }).forEach(([name, content]) => {
          let meta = document.head.querySelector(`meta[name="${name}"]`);
          if (!meta) {
            meta = document.createElement("meta");
            meta.name = name;
            document.head.appendChild(meta);
          }
          meta.content = content;
        });
      }

      function upsertBodyAttributes() {
        Object.entries({
          "data-ldl-product-name": record.productName,
          "data-ldl-product-name-en": record.productNameEn,
          "data-ldl-product-code": record.productCode,
          "data-ldl-tool-id": record.toolId,
          "data-ldl-module-id": record.moduleId,
          "data-ldl-build-id": record.buildId,
          "data-ldl-fingerprint": record.fingerprint,
          "data-ldl-marker-signature": record.markerSignature
        }).forEach(([name, value]) => document.body.setAttribute(name, value));
      }

      function getOrCreateElement(tagName, id, parent) {
        let element = document.getElementById(id);
        if (!element) {
          element = document.createElement(tagName);
          element.id = id;
          parent.appendChild(element);
        }
        return element;
      }

      function upsertJsonRecord() {
        const script = getOrCreateElement("script", "ldl-source-reference", document.body);
        script.type = "application/json";
        script.textContent = JSON.stringify(record, null, 2);
      }

      function upsertHiddenDomReference() {
        const hidden = getOrCreateElement("div", "ldl-hidden-source-reference", document.body);
        hidden.className = "ldl-offscreen-source-reference";
        hidden.setAttribute("aria-hidden", "true");
        Object.entries({
          "data-ldl-product-name": record.productName,
          "data-ldl-product-name-en": record.productNameEn,
          "data-ldl-product-code": record.productCode,
          "data-ldl-tool-id": record.toolId,
          "data-ldl-module-id": record.moduleId,
          "data-ldl-company": record.company,
          "data-ldl-author": record.author,
          "data-ldl-release-year": String(record.releaseYear),
          "data-ldl-version": record.version,
          "data-ldl-build-id": record.buildId,
          "data-ldl-fingerprint": record.fingerprint,
          "data-ldl-marker-signature": record.markerSignature
        }).forEach(([name, value]) => hidden.setAttribute(name, value));
        hidden.textContent = Object.values(record).join(" | ");
      }

      function upsertSvgMetadata() {
        let svg = document.getElementById("ldl-hidden-svg-source-reference");
        if (!svg) {
          svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.id = "ldl-hidden-svg-source-reference";
          document.body.appendChild(svg);
        }
        svg.setAttribute("class", "ldl-offscreen-source-reference");
        svg.setAttribute("width", "0");
        svg.setAttribute("height", "0");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");

        let metadata = svg.querySelector("metadata");
        if (!metadata) {
          metadata = document.createElementNS("http://www.w3.org/2000/svg", "metadata");
          svg.appendChild(metadata);
        }
        metadata.textContent = JSON.stringify(record);
      }

      function upsertVisibleWatermark() {
        const watermark = getOrCreateElement("div", "ldl-visible-watermark", document.body);
        watermark.className = "ldl-visible-watermark";
        watermark.setAttribute("aria-hidden", "true");
        watermark.innerHTML = "";

        const text = document.createElement("span");
        text.textContent = `© ${record.releaseYear} - Yung Fu Chuen`;

        watermark.append(text);
      }

      try {
        setCssCustomProperties();
        upsertMetaTags();
        upsertBodyAttributes();
        upsertJsonRecord();
        upsertHiddenDomReference();
        upsertSvgMetadata();
        upsertVisibleWatermark();
        Object.defineProperty(window, "__LDL_SOURCE_REFERENCE__", {
          value: record,
          writable: false,
          configurable: true,
          enumerable: false
        });
        console.info(`© ${record.releaseYear} Yung Fu Chuen - Created by ${record.author} - LDL Source Reference v${record.version}`);
      } catch (error) {
        console.warn("LDL Source Reference failed to initialize.", error);
      }
    })();
  </script>
