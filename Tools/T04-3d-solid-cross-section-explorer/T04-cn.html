<script type="module">

    const LDL_RELEASE_YEAR = 2026;
    const LDL_VERSION = "1.1.0";
    const LDL_PRODUCT_NAME = "立體截面探索器";
    const LDL_PRODUCT_NAME_EN = "3D Solid Cross-Section Explorer";
    const LDL_PRODUCT_CODE = "LDL-MATH-3D-2026-001";
    const LDL_TOOL_ID = "T04-3d-solid-cross-section-explorer";
    const LDL_MODULE_ID = "ldl-3d-solid-cross-section-explorer";
    const LDL_BUILD_ID = "LDL-MATH-3D-2026-001";

    const LDL_LICENSE = "Free classroom use only. Redistribution, resale, cloning, re-hosting, modification, or derivative use without written permission is prohibited.";
    const LDL_CONSOLE_MESSAGE = `© ${LDL_RELEASE_YEAR} Yung Fu Chuen｜Created by Yung Fu Chuen｜LDL Source Reference v1.1`;
    const LDL_MARKER_SIGNATURE = "LDL-SOURCE-REFERENCE-v1.1::Yung-Fu-Chuen::2026";

    function createLDLSourceRecord() {
      return Object.freeze({
        productName: LDL_PRODUCT_NAME,
        productNameEn: LDL_PRODUCT_NAME_EN,
        productCode: LDL_PRODUCT_CODE,
        toolId: LDL_TOOL_ID,
        moduleId: LDL_MODULE_ID,
        company: LDL_COMPANY,
        author: LDL_AUTHOR,
        releaseYear: LDL_RELEASE_YEAR,
        version: LDL_VERSION,
        copyright: LDL_COPYRIGHT,
        license: LDL_LICENSE,
        buildId: LDL_BUILD_ID,
        fingerprint: LDL_FINGERPRINT,
        markerSignature: LDL_MARKER_SIGNATURE
      });
    }

    function initLDLSourceReference() {
      try {
        const record = createLDLSourceRecord();
        setLDLCssCustomProperties(record);
        upsertLDLMetaTags(record);
        upsertLDLBodyAttributes(record);
        upsertLDLJsonRecord(record);
        upsertLDLHiddenDomReference(record);
        upsertLDLSvgMetadata(record);
        upsertLDLVisibleWatermark();

        Object.defineProperty(window, "__LDL_SOURCE_REFERENCE__", {
          value: record,
          writable: false,
          configurable: true,
          enumerable: false
        });

        console.info(LDL_CONSOLE_MESSAGE);
      } catch (error) {
        console.warn("LDL Source Reference failed to initialize.", error);
      }
    }

    function setLDLCssCustomProperties(record) {
      const root = document.documentElement;
      root.style.setProperty("--ldl-product-name", JSON.stringify(record.productName));
      root.style.setProperty("--ldl-product-name-en", JSON.stringify(record.productNameEn));
      root.style.setProperty("--ldl-product-code", JSON.stringify(record.productCode));
      root.style.setProperty("--ldl-tool-id", JSON.stringify(record.toolId));
      root.style.setProperty("--ldl-module-id", JSON.stringify(record.moduleId));
      root.style.setProperty("--ldl-company", JSON.stringify(record.company));
      root.style.setProperty("--ldl-author", JSON.stringify(record.author));
      root.style.setProperty("--ldl-release-year", String(record.releaseYear));
      root.style.setProperty("--ldl-version", JSON.stringify(record.version));
      root.style.setProperty("--ldl-build-id", JSON.stringify(record.buildId));
      root.style.setProperty("--ldl-fingerprint", JSON.stringify(record.fingerprint));
    }

    function upsertLDLMetaTags(record) {
      const metaValues = {
        author: record.author,
        company: record.company,
        copyright: record.copyright,
        license: record.license,
        "ldl-product-name": record.productName,
        "ldl-product-name-en": record.productNameEn,
        "ldl-product-code": record.productCode,
        "ldl-tool-id": record.toolId,
        "ldl-module-id": record.moduleId,
        "ldl-release-year": String(record.releaseYear),
        "ldl-version": record.version,
        "ldl-build-id": record.buildId,
        "ldl-fingerprint": record.fingerprint,
        "ldl-source-reference": `LDL Source Reference ${record.version} · ${record.company} · ${record.author}`
      };

      Object.entries(metaValues).forEach(([name, content]) => {
        let meta = document.head.querySelector(`meta[name="${name}"]`);
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", name);
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", content);
      });
    }

    function upsertLDLBodyAttributes(record) {
      const attrs = {
        "data-ldl-product-name": record.productName,
        "data-ldl-product-name-en": record.productNameEn,
        "data-ldl-product-code": record.productCode,
        "data-ldl-tool-id": record.toolId,
        "data-ldl-module-id": record.moduleId,
        "data-ldl-build-id": record.buildId,
        "data-ldl-fingerprint": record.fingerprint,
        "data-ldl-marker-signature": record.markerSignature
      };

      Object.entries(attrs).forEach(([name, value]) => {
        document.body.setAttribute(name, value);
      });
    }

    function upsertLDLJsonRecord(record) {
      let script = document.getElementById("ldl-source-reference");
      if (!script) {
        script = document.createElement("script");
        script.type = "application/json";
        script.id = "ldl-source-reference";
        document.body.appendChild(script);
      }
      script.textContent = JSON.stringify(record, null, 2);
    }

    function upsertLDLHiddenDomReference(record) {
      const hidden = getOrCreateLDLElement("div", "ldl-hidden-source-reference", document.body);
      hidden.className = "ldl-offscreen-source-reference";
      hidden.setAttribute("aria-hidden", "true");
      hidden.setAttribute("data-ldl-product-name", record.productName);
      hidden.setAttribute("data-ldl-product-name-en", record.productNameEn);
      hidden.setAttribute("data-ldl-product-code", record.productCode);
      hidden.setAttribute("data-ldl-tool-id", record.toolId);
      hidden.setAttribute("data-ldl-module-id", record.moduleId);
      hidden.setAttribute("data-ldl-company", record.company);
      hidden.setAttribute("data-ldl-author", record.author);
      hidden.setAttribute("data-ldl-release-year", String(record.releaseYear));
      hidden.setAttribute("data-ldl-version", record.version);
      hidden.setAttribute("data-ldl-build-id", record.buildId);
      hidden.setAttribute("data-ldl-fingerprint", record.fingerprint);

    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        child.traverse((node) => {
          if (node.geometry) node.geometry.dispose();
          if (node.material && node.material.map) node.material.map.dispose();
          if (node.material && node.material.dispose && node.material !== solidMaterial && node.material !== curvedMaterial && node.material !== baseMaterial && node.material !== edgeMaterial && node.material !== curveLineMaterial && node.material !== sectionFillMaterial && node.material !== sectionOutlineMaterial && node.material !== splitSurfaceMaterial && node.material !== splitCapMaterial && node.material !== splitCapOutlineMaterial && node.material !== splitEdgeMaterial) {
            node.material.dispose();
          }
        });
      }
    }

    function makeLabel(text, position, color = "#17354a", scale = 1) {
      const canvas = document.createElement("canvas");
      canvas.width = 192;
      canvas.height = 88;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = color;
      ctx.font = "900 40px Microsoft JhengHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(255,255,255,0.95)";
      ctx.shadowBlur = 7;
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.strokeText(text, 96, 42);
      ctx.shadowBlur = 0;
      ctx.fillText(text, 96, 42);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));

    function makeBaseDisc(radius, y, sides, rotation = 0) {
      const geometry = new THREE.CircleGeometry(radius, sides);
      geometry.rotateX(-Math.PI / 2);
      geometry.rotateY(rotation);
      geometry.translate(0, y, 0);
      return new THREE.Mesh(geometry, baseMaterial);
    }

    function polygonVertices(sides, radius, y) {
      const vertices = [];
      for (let i = 0; i < sides; i++) {
        const angle = -Math.PI / 2 + (Math.PI * 2 * i) / sides;
        vertices.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
      }
      return vertices;
    }

    function makePolygonPrismGeometry(sides, radius, height) {
      const topY = height / 2;
      const bottomY = -height / 2;
      const top = polygonVertices(sides, radius, topY);
      const bottom = polygonVertices(sides, radius, bottomY);
      const vertices = [...bottom, ...top, new THREE.Vector3(0, bottomY, 0), new THREE.Vector3(0, topY, 0)];
      const bottomCenter = sides * 2;
      const topCenter = sides * 2 + 1;
      const indices = [];

      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        indices.push(i, next, sides + next, i, sides + next, sides + i);
        indices.push(bottomCenter, next, i);
        indices.push(topCenter, sides + i, sides + next);
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function makePolygonPrismSolidData(sides, radius, height) {
      const topY = height / 2;
      const bottomY = -height / 2;
      const bottom = polygonVertices(sides, radius, bottomY);
      const top = polygonVertices(sides, radius, topY);
      const vertices = [...bottom, ...top];
      const edges = [];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        edges.push([i, next], [sides + i, sides + next], [i, sides + i]);
      }
      return { kind: "polyhedron", vertices, edges };
    }

    function makePolygonPyramidGeometry(sides, radius, height) {
      const baseY = -height / 2;
      const base = polygonVertices(sides, radius, baseY);
      const apexIndex = sides;
      const centerIndex = sides + 1;
      const vertices = [...base, new THREE.Vector3(0, height / 2, 0), new THREE.Vector3(0, baseY, 0)];
      const indices = [];

      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        indices.push(i, next, apexIndex);
        indices.push(centerIndex, next, i);
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function makePolygonPyramidSolidData(sides, radius, height) {
      const baseY = -height / 2;
      const base = polygonVertices(sides, radius, baseY);
      const apex = new THREE.Vector3(0, height / 2, 0);
      const vertices = [...base, apex];
      const apexIndex = vertices.length - 1;
      const edges = [];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        edges.push([i, next], [i, apexIndex]);
      }
      return { kind: "polyhedron", vertices, edges };
    }

    function addPolygonPrismEdges(sides, radius, height) {
      const topY = height / 2;
      const bottomY = -height / 2;
      const points = polygonVertices(sides, radius, 0);
      const lines = [];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        lines.push(
          points[i].clone().setY(topY),
          points[next].clone().setY(topY),
          points[i].clone().setY(bottomY),
          points[next].clone().setY(bottomY),
          points[i].clone().setY(bottomY),
          points[i].clone().setY(topY)
        );
      }

      const edges = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), edgeMaterial);
      edges.renderOrder = 30;
      modelGroup.add(edges);
    }

    function addPolygonPyramidEdges(sides, radius, height) {
      const baseY = -height / 2;
      const apex = new THREE.Vector3(0, height / 2, 0);
      const points = polygonVertices(sides, radius, baseY);

      const lines = [];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        lines.push(points[i], points[next], points[i], apex);
      }

      const edges = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), edgeMaterial);
      edges.renderOrder = 30;
      modelGroup.add(edges);
    }

    function addCircleEdge(radius, y) {
      const ring = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(makeCirclePoints(radius, y, 128)),
        edgeMaterial
      );
      ring.renderOrder = 30;
      modelGroup.add(ring);
    }

    function addCurvedGuides(kind) {
      const guideGroup = new THREE.Group();
      const ringCount = kind === "sphere" ? 5 : 4;
      for (let i = 0; i < ringCount; i++) {
        const y = kind === "sphere" ? -0.8 + i * 0.4 : -0.9 + i * 0.6;
        let radius = 1.05;
        if (kind === "cone") radius = Math.max(0.08, (1.2 - (y + 1.2)) / 2.4 * 1.2);
        if (kind === "sphere") radius = Math.sqrt(Math.max(0.01, 1.2 * 1.2 - y * y));
        const ring = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(makeCirclePoints(radius, y, 96)),
          curveLineMaterial
        );
        guideGroup.add(ring);
      }

      if (kind !== "sphere") {
        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8;
          const x = Math.cos(angle) * 1.08;
          const z = Math.sin(angle) * 1.08;
          const top = kind === "cone" ? new THREE.Vector3(0, 1.2, 0) : new THREE.Vector3(x, 1.2, z);
          const bottom = new THREE.Vector3(x, -1.2, z);
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([bottom, top]), curveLineMaterial);
          guideGroup.add(line);
        }
      } else {
        for (let i = 0; i < 3; i++) {
          const circle = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(makeCirclePoints(1.2, 0, 128)),
            curveLineMaterial
          );
          circle.rotation.x = (Math.PI / 2) * i;
          guideGroup.add(circle);
        }
      }

      modelGroup.add(guideGroup);
    }

    function makeCirclePoints(radius, y, segments) {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const angle = (Math.PI * 2 * i) / segments;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
      }
      return points;
    }

    function buildSolid() {
      clearGroup(modelGroup);
      clearGroup(splitResultGroup);
      clearGroup(labelGroup);
      clearGroup(sectionFillGroup);
      cuttingPlane.visible = false;
      modelGroup.visible = true;
      labelGroup.visible = true;
      state.animation = null;
      state.splitAnimation = null;
      state.cut = null;
      state.currentSection = null;
      if (separateButton) separateButton.disabled = true;
      cutButtons.forEach((button) => button.classList.remove("active"));
      resetResult();

      let mesh;
      const n = state.sideCount;
      const type = getSolidType();

      if (type === "polygonPrism") {
        mesh = new THREE.Mesh(makePolygonPrismGeometry(n, 1.14, 2.35), solidMaterial);
        modelGroup.add(mesh);
        addPolygonPrismEdges(n, 1.14, 2.35);
        state.currentSolid = makePolygonPrismSolidData(n, 1.14, 2.35);
      } else if (type === "cylinder") {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.08, 2.35, 96, 1, false), curvedMaterial);
        modelGroup.add(mesh);
        modelGroup.add(makeBaseDisc(1.08, -1.19, 96));
        addCircleEdge(1.08, -1.19);
        addCircleEdge(1.08, 1.19);
        state.currentSolid = { kind: "cylinder", radius: 1.08, height: 2.35 };
      } else if (type === "polygonPyramid") {
        mesh = new THREE.Mesh(makePolygonPyramidGeometry(n, 1.22, 2.45), solidMaterial);
        modelGroup.add(mesh);
        addPolygonPyramidEdges(n, 1.22, 2.45);
        state.currentSolid = makePolygonPyramidSolidData(n, 1.22, 2.45);
      } else if (type === "cone") {
        mesh = new THREE.Mesh(new THREE.ConeGeometry(1.18, 2.45, 96, 1, false), curvedMaterial);
        modelGroup.add(mesh);
        modelGroup.add(makeBaseDisc(1.18, -1.23, 96));
        addCircleEdge(1.18, -1.23);
        state.currentSolid = { kind: "cone", radius: 1.18, height: 2.45 };
      } else {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(1.18, 64, 34), curvedMaterial);
        modelGroup.add(mesh);
        state.currentSolid = { kind: "sphere", radius: 1.18 };
      }

      solidNameEl.textContent = getSolidName();
      makeLabel(getSolidName(), new THREE.Vector3(0, type === "sphere" ? 1.48 : 1.62, 0), "#17354a", 1.05);
      statusEl.innerHTML = "拖曳可旋轉<br>滾輪可縮放";
      camera.up.set(0, 1, 0);
      controls.reset();
      camera.position.set(4, 3.2, 4.8);
      controls.target.set(0, 0, 0);
      controls.update();
      resizeRenderer();
    }

    function getSolidType() {
      if (state.category === "sphere") return "sphere";
      return state.subtype;
    }

    function getSolidName() {
      const n = state.sideCount;
      const sideName = toChineseNumber(n);
      if (state.category === "sphere") return "球";
      if (state.subtype === "cylinder") return "圓柱";
      if (state.subtype === "cone") return "圓錐";
      if (state.subtype === "polygonPrism") return `${sideName}角柱`;
      return `${sideName}角錐`;
    }

    function toChineseNumber(value) {
      const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      const n = Math.max(3, Math.min(100, Number.parseInt(value, 10) || 4));
      if (n === 100) return "一百";
      if (n < 10) return digits[n];
      if (n === 10) return "十";
      if (n < 20) return `十${digits[n % 10]}`;
      const tens = Math.floor(n / 10);
      const ones = n % 10;
      return `${digits[tens]}十${ones ? digits[ones] : ""}`;
    }

    function resetResult() {
      shapeStage.innerHTML = '<div class="shape-placeholder">請選擇切法</div>';
      shapeName.textContent = "--";
    }

    function getVerticalCutNormal() {
      const type = getSolidType();
      if (type === "polygonPrism" || type === "polygonPyramid") {
        const sides = Math.max(3, state.sideCount);
        const sideMidpointAngle = -Math.PI / 2 + Math.PI / sides;
        const normalAngle = sideMidpointAngle + Math.PI / 2;
        return new THREE.Vector3(Math.cos(normalAngle), 0, Math.sin(normalAngle)).normalize();
      }
      return new THREE.Vector3(1, 0, 0);
    }

    function startCut(cut) {
      state.cut = cut;
      state.splitAnimation = null;
      modelGroup.visible = true;
      labelGroup.visible = true;
      cuttingPlane.visible = true;
      clearGroup(splitResultGroup);
      clearGroup(sectionFillGroup);
      if (separateButton) separateButton.disabled = true;
      cutButtons.forEach((button) => button.classList.toggle("active", button.dataset.cut === cut));

      const normal = new THREE.Vector3();
      if (cut === "horizontal") normal.set(0, 1, 0);
      if (cut === "vertical") normal.copy(getVerticalCutNormal());
      if (cut === "slanted") normal.set(0.52, 0.78, 0.34).normalize();

      cuttingPlane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
      cuttingPlane.position.copy(normal.clone().multiplyScalar(-2.35));
      cuttingPlane.visible = true;
      planeMaterial.opacity = 0.54;
      statusEl.innerHTML = "正在切割...";

      state.animation = {
        start: performance.now(),
        duration: 1050,
        normal,
        from: -2.35,
        to: 0
      };
    }

    function finishCut() {
      updateComputedSection(true);
      if (separateButton) separateButton.disabled = false;
      statusEl.innerHTML = "已顯示截面<br>可再選其他切法";
    }

    function separateCurrentSection() {
      if (!state.cut || state.animation) return;
      const section = state.currentSection || updateComputedSection(true);
      if (!section || !section.points || section.points.length < 3) return;
      buildSplitResult(section);
      modelGroup.visible = false;
      labelGroup.visible = false;
      cuttingPlane.visible = false;
      if (separateButton) separateButton.disabled = true;
    }

    function buildSplitResult(section) {
      clearGroup(splitResultGroup);
      state.splitAnimation = null;
      if (!section || !section.points || section.points.length < 3) return;

      const { normal, point } = getPlaneWorldData();
      const splitAxis = getLeftRightSplitAxis();
      const positivePlane = makeOffsetPlane(normal, point, 0);
      const negativePlane = makeOffsetPlane(normal.clone().negate(), point, 0);
      const positiveHalf = cloneModelForSplit(positivePlane);
      const negativeHalf = cloneModelForSplit(negativePlane);
      const positiveCap = makeSplitCap(section, normal, 0.002);
      const negativeCap = makeSplitCap(section, normal, -0.002);

      positiveHalf.userData.splitSign = 1;
      negativeHalf.userData.splitSign = -1;
      positiveHalf.userData.clipPlane = positivePlane;
      negativeHalf.userData.clipPlane = negativePlane;
      positiveCap.userData.splitSign = 1;
      negativeCap.userData.splitSign = -1;

      splitResultGroup.add(positiveHalf, negativeHalf, positiveCap, negativeCap);
      state.splitAnimation = {
        start: performance.now(),
        duration: 680,
        normal,
        point,
        splitAxis,
        distance: 1.38,
        halves: [positiveHalf, negativeHalf],
        caps: [positiveCap, negativeCap]
      };
      updateSplitResult(0);
    }

    function getLeftRightSplitAxis() {
      return new THREE.Vector3(1, 0, 0);
    }

    function makeOffsetPlane(normal, point, offset) {
      const planePoint = point.clone().addScaledVector(normal, offset);
      return new THREE.Plane(normal.clone(), -normal.dot(planePoint));
    }

    function cloneModelForSplit(clipPlane) {
      const clone = new THREE.Group();
      modelGroup.children.forEach((child) => {
        clone.add(cloneSplitNode(child, clipPlane));
      });
      return clone;
    }

    function cloneSplitNode(source, clipPlane) {
      const clone = source.clone(false);
      if (source.geometry) clone.geometry = source.geometry.clone();

      if (source.isMesh) {
        clone.material = splitSurfaceMaterial.clone();
        clone.material.clippingPlanes = [clipPlane];
        clone.renderOrder = Math.max(source.renderOrder || 0, 18);
      } else if (source.isLine || source.isLineSegments || source.isLineLoop) {
        clone.material = splitEdgeMaterial.clone();
        clone.material.clippingPlanes = [clipPlane];
        clone.renderOrder = Math.max(source.renderOrder || 0, 32);
      } else if (source.material && source.material.clone) {
        clone.material = source.material.clone();
        clone.material.clippingPlanes = [clipPlane];
      }

      source.children.forEach((child) => {
        clone.add(cloneSplitNode(child, clipPlane));
      });
      return clone;
    }

    function makeSplitCap(section, normal, lift) {
      const group = new THREE.Group();
      group.position.copy(cuttingPlane.position).addScaledVector(normal, lift);
      group.quaternion.copy(cuttingPlane.quaternion);
      group.renderOrder = 42;

      const shape = new THREE.Shape();
      shape.moveTo(section.points[0].x, section.points[0].y);
      for (let i = 1; i < section.points.length; i++) {
        shape.lineTo(section.points[i].x, section.points[i].y);
      }
      shape.closePath();

      const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), splitCapMaterial.clone());
      fill.renderOrder = 43;
      const outlinePoints = section.points.map((sectionPoint) => new THREE.Vector3(sectionPoint.x, sectionPoint.y, 0.004));
      const outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outlinePoints), splitCapOutlineMaterial.clone());
      outline.renderOrder = 44;
      group.add(fill, outline);
      return group;
    }

    function updateSplitResult(progress) {
      if (!state.splitAnimation) return;
      const { normal, point, splitAxis, distance, halves, caps } = state.splitAnimation;
      halves.forEach((half) => {
        const signedDistance = distance * progress * half.userData.splitSign;
        const offset = splitAxis.clone().multiplyScalar(signedDistance);
        half.position.copy(offset);
        const planeNormal = normal.clone().multiplyScalar(half.userData.splitSign);
        half.userData.clipPlane.normal.copy(planeNormal);
        half.userData.clipPlane.constant = -planeNormal.dot(point.clone().add(offset));
      });
      caps.forEach((cap) => {
        const signedDistance = distance * progress * cap.userData.splitSign;
        cap.position.copy(point)
          .addScaledVector(splitAxis, signedDistance)
          .addScaledVector(normal, 0.002 * cap.userData.splitSign);
      });
    }

    function updateComputedSection(updatePanel = true) {
      if (!state.cut || !state.currentSolid || !cuttingPlane.visible) return null;
      const section = computeSectionGeometry();
      state.currentSection = section;
      render3DIntersection(section);
      if (updatePanel) renderRightPanelSection(section);
      return section;
    }

    function computeSectionGeometry() {
      return computePlaneSolidIntersection();
    }

    function computePlaneSolidIntersection() {
      cuttingPlane.updateMatrixWorld(true);
      modelGroup.updateMatrixWorld(true);
      const solid = state.currentSolid;
      if (!solid) return null;
      if (solid.kind === "polyhedron") return computePolyhedronSection(solid);
      return computeCurvedSolidSection(solid);
    }

    function getPlaneWorldData() {
      const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(cuttingPlane.quaternion).normalize();
      const point = cuttingPlane.position.clone();
      return { normal, point, constant: normal.dot(point) };
    }

    function projectWorldToPlane2D(point) {
      const local = cuttingPlane.worldToLocal(point.clone());
      return new THREE.Vector2(local.x, local.y);
    }

    function plane2DToWorld(point) {
      return cuttingPlane.localToWorld(new THREE.Vector3(point.x, point.y, 0));
    }

    function computePolyhedronSection(solid) {
      const { normal, constant } = getPlaneWorldData();
      const eps = 1e-5;
      const points = [];

      solid.edges.forEach(([aIndex, bIndex]) => {
        const a = solid.vertices[aIndex].clone().applyMatrix4(modelGroup.matrixWorld);
        const b = solid.vertices[bIndex].clone().applyMatrix4(modelGroup.matrixWorld);
        const da = normal.dot(a) - constant;
        const db = normal.dot(b) - constant;

        if (Math.abs(da) < eps) points.push(projectWorldToPlane2D(a));
        if (Math.abs(db) < eps) points.push(projectWorldToPlane2D(b));
        if (da * db < -eps) {
          const t = da / (da - db);
          points.push(projectWorldToPlane2D(a.clone().lerp(b, t)));
        }
      });

      const unique = unique2DPoints(points);
      if (unique.length < 3) return null;
      const sorted = sortPointsByCentroid(unique);
      return {
        kind: "polygon",
        points: sorted,
        name: polygonSectionName(sorted.length)
      };
    }

    function computeCurvedSolidSection(solid) {
      const { normal, constant } = getPlaneWorldData();
      const eps = 1e-4;

      if (solid.kind === "sphere") {
        const distance = Math.abs(constant);
        if (distance > solid.radius + eps) return null;
        const radius = Math.sqrt(Math.max(0, solid.radius * solid.radius - distance * distance));
        return makePointSection(circlePoints2D(radius, radius, 144), "圓形");
      }

      if (solid.kind === "cylinder") {
        const half = solid.height / 2;
        if (Math.abs(normal.y) > 0.999) {
          const y = constant / normal.y;
          if (y < -half - eps || y > half + eps) return null;
          return makePointSection(circlePoints2D(solid.radius, solid.radius, 144), "圓形");
        }

        if (Math.abs(normal.y) < eps) {
          if (Math.abs(constant) > solid.radius + eps) return null;
          const tangent = new THREE.Vector3(-normal.z, 0, normal.x).normalize();
          const center = normal.clone().multiplyScalar(constant);
          const chordHalfWidth = Math.sqrt(Math.max(0, solid.radius * solid.radius - constant * constant));
          const points = [
            center.clone().addScaledVector(tangent, -chordHalfWidth).setY(-half),
            center.clone().addScaledVector(tangent, chordHalfWidth).setY(-half),
            center.clone().addScaledVector(tangent, chordHalfWidth).setY(half),
            center.clone().addScaledVector(tangent, -chordHalfWidth).setY(half)
          ].map(projectWorldToPlane2D);
          return makePointSection(sortPointsByCentroid(points), polygonSectionName(4));
        }

        return makePointSection(sampleConvexPlaneSection(solid, 168), "橢圓形");
      }

      if (solid.kind === "cone") {
        const half = solid.height / 2;
        if (Math.abs(normal.y) > 0.999) {
          const y = constant / normal.y;
          if (y < -half - eps || y > half + eps) return null;
          const radius = coneRadiusAtY(solid, y);
          return makePointSection(circlePoints2D(radius, radius, 144), "圓形");
        }

        if (Math.abs(normal.y) < eps && Math.abs(constant) < eps) {
          const tangent = new THREE.Vector3(-normal.z, 0, normal.x).normalize();
          const points = [
            new THREE.Vector3(0, half, 0),
            new THREE.Vector3().copy(tangent).multiplyScalar(solid.radius).setY(-half),
            new THREE.Vector3().copy(tangent).multiplyScalar(-solid.radius).setY(-half)
          ].map(projectWorldToPlane2D);
          return makePointSection(sortPointsByCentroid(points), "三角形");
        }

        return makePointSection(sampleConvexPlaneSection(solid, 168), "橢圓形");
      }

      return null;
    }

    function makePointSection(points, name) {
      const clean = unique2DPoints(points || []);
      if (clean.length < 3) return null;
      return { kind: "computed", points: sortPointsByCentroid(clean), name };
    }

    function sampleConvexPlaneSection(solid, samples = 144) {
      const center = findInteriorPointOnPlane(solid);
      if (!center) return [];
      const points = [];
      for (let i = 0; i < samples; i++) {
        const angle = (Math.PI * 2 * i) / samples;
        const dir = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
        let high = 0.02;
        while (high < 5 && pointInsideSolid(plane2DToWorld(center.clone().addScaledVector(dir, high)), solid)) {
          high *= 1.8;
        }
        let low = 0;
        for (let step = 0; step < 42; step++) {
          const mid = (low + high) / 2;
          if (pointInsideSolid(plane2DToWorld(center.clone().addScaledVector(dir, mid)), solid)) low = mid;
          else high = mid;
        }
        points.push(center.clone().addScaledVector(dir, low));
      }
      return points;
    }

    function findInteriorPointOnPlane(solid) {
      const candidates = [new THREE.Vector2(0, 0)];
      for (let ring = 1; ring <= 8; ring++) {
        const radius = ring * 0.18;
        for (let i = 0; i < 16; i++) {
          const angle = (Math.PI * 2 * i) / 16;
          candidates.push(new THREE.Vector2(Math.cos(angle) * radius, Math.sin(angle) * radius));
        }
      }
      return candidates.find((point) => pointInsideSolid(plane2DToWorld(point), solid)) || null;
    }

    function pointInsideSolid(point, solid) {
      const eps = 1e-5;
      if (solid.kind === "sphere") return point.lengthSq() <= solid.radius * solid.radius + eps;
      if (solid.kind === "cylinder") {
        const half = solid.height / 2;
        return point.y >= -half - eps && point.y <= half + eps && point.x * point.x + point.z * point.z <= solid.radius * solid.radius + eps;
      }
      if (solid.kind === "cone") {
        const half = solid.height / 2;
        if (point.y < -half - eps || point.y > half + eps) return false;
        const radius = coneRadiusAtY(solid, point.y);
        return point.x * point.x + point.z * point.z <= radius * radius + eps;
      }
      return false;
    }

    function coneRadiusAtY(solid, y) {
      const half = solid.height / 2;
      return Math.max(0, solid.radius * (half - y) / solid.height);
    }

    function circlePoints2D(rx, ry, samples) {
      const points = [];
      for (let i = 0; i < samples; i++) {
        const angle = (Math.PI * 2 * i) / samples;
        points.push(new THREE.Vector2(Math.cos(angle) * rx, Math.sin(angle) * ry));
      }
      return points;
    }

    function unique2DPoints(points) {
      const eps = 1e-4;
      const unique = [];
      points.forEach((point) => {
        if (!unique.some((other) => other.distanceTo(point) < eps)) unique.push(point.clone());
      });
      return unique;
    }

    function sortPointsByCentroid(points) {
      const centroid = points.reduce((sum, point) => sum.add(point), new THREE.Vector2()).multiplyScalar(1 / points.length);
      return [...points].sort((a, b) => Math.atan2(a.y - centroid.y, a.x - centroid.x) - Math.atan2(b.y - centroid.y, b.x - centroid.x));
    }

    function polygonSectionName(count) {
      if (count === 3) return "三角形";
      return `${toChineseNumber(count)}邊形`;
    }

    function render3DIntersection(section) {
      clearGroup(sectionFillGroup);
      if (!section || !section.points || section.points.length < 3) return;
      const fill = buildGreenSectionPatch(section);
      const outline = buildGreenSectionOutline(section);
      sectionFillGroup.add(fill, outline);
    }

    function buildGreenSectionPatch(section) {
      const shape = new THREE.Shape();
      shape.moveTo(section.points[0].x, section.points[0].y);
      for (let i = 1; i < section.points.length; i++) {
        shape.lineTo(section.points[i].x, section.points[i].y);
      }
      shape.closePath();

      const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), sectionFillMaterial);
      fill.renderOrder = 36;
      return fill;
    }

    function buildGreenSectionOutline(section) {
      const outlinePoints = section.points.map((point) => new THREE.Vector3(point.x, point.y, 0.001));
      const outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outlinePoints), sectionOutlineMaterial);
      outline.renderOrder = 37;
      return outline;
    }

    function renderRightPanelSection(section) {
      if (!section || !section.points || section.points.length < 3) {
        resetResult();
        return;
      }
      shapeName.textContent = getSectionNameFromComputedShape(section);
      shapeStage.innerHTML = renderComputedSectionSvg(section);
    }

    function render2DSection(section) {
      renderRightPanelSection(section);
    }

    function getSectionNameFromComputedShape(section) {
      if (!section || !section.points) return "--";
      if (section.name === "圓形" || section.name === "橢圓形") return section.name;
      return polygonSectionName(section.points.length);
    }

    function renderComputedSectionSvg(section) {
      const width = 240;
      const height = 220;
      const pad = 34;
      const xs = section.points.map((point) => point.x);
      const ys = section.points.map((point) => point.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const scale = Math.min((width - pad * 2) / Math.max(0.001, maxX - minX), (height - pad * 2) / Math.max(0.001, maxY - minY));
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const svgPoints = section.points
        .map((point) => {
          const x = width / 2 + (point.x - cx) * scale;
          const y = height / 2 - (point.y - cy) * scale;
          return `${x.toFixed(2)},${y.toFixed(2)}`;
        })
        .join(" ");

      return `<svg width="240" height="220" viewBox="0 0 240 220" role="img" aria-label="截面圖">
        <polygon points="${svgPoints}" fill="rgba(124, 255, 114, 0.34)" stroke="#00a82a" stroke-width="6" stroke-linejoin="round"/>
      </svg>`;
    }

    function setCategory(category) {
      state.category = category;
      categoryButtons.forEach((button) => button.classList.toggle("active", button.dataset.category === category));
      subtypeGroup.classList.toggle("hidden", category === "sphere");
      prismSubtypes.classList.toggle("hidden", category !== "prism");
      pyramidSubtypes.classList.toggle("hidden", category !== "pyramid");

      if (category === "prism") {
        state.subtype = state.prismSubtype;
        updateSubtypeButtons(prismSubtypes, state.subtype);
      } else if (category === "pyramid") {
        state.subtype = state.pyramidSubtype;
        updateSubtypeButtons(pyramidSubtypes, state.subtype);
      } else {
        state.subtype = "sphere";
      }

      updateSideInputVisibility();
      buildSolid();
    }

    function setSubtype(subtype) {
      state.subtype = subtype;
      if (state.category === "prism") state.prismSubtype = subtype;
      if (state.category === "pyramid") state.pyramidSubtype = subtype;
      updateSubtypeButtons(state.category === "prism" ? prismSubtypes : pyramidSubtypes, subtype);
      updateSideInputVisibility();
      buildSolid();
    }

    function updateSubtypeButtons(container, subtype) {
      [...container.querySelectorAll(".subtype-button")].forEach((button) => {
        button.classList.toggle("active", button.dataset.subtype === subtype);
      });
    }

    function updateSideInputVisibility() {
      const type = getSolidType();
      sideCountGroup.classList.toggle("hidden", type !== "polygonPrism" && type !== "polygonPyramid");
    }

    function clampSideCount(value) {
      const parsed = Number.parseInt(value, 10);
      if (Number.isNaN(parsed)) return 4;
      return Math.max(3, Math.min(100, parsed));
    }

    categoryButtons.forEach((button) => {
      button.addEventListener("click", () => setCategory(button.dataset.category));
    });

    subtypeButtons.forEach((button) => {
      button.addEventListener("click", () => setSubtype(button.dataset.subtype));
    });

    sideCountInput.addEventListener("change", () => {
      state.sideCount = clampSideCount(sideCountInput.value);
      sideCountInput.value = state.sideCount;
      buildSolid();
    });

    sideCountInput.addEventListener("input", () => {
      const value = Number.parseInt(sideCountInput.value, 10);
      if (!Number.isNaN(value) && value >= 3 && value <= 100) {
        state.sideCount = value;
        buildSolid();
      }
    });

    cutButtons.forEach((button) => {
      button.addEventListener("click", () => startCut(button.dataset.cut));
    });

    if (separateButton) {
      separateButton.addEventListener("click", separateCurrentSection);
    }

    function resizeRenderer() {
      const rect = viewer.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener("resize", resizeRenderer);
    new ResizeObserver(resizeRenderer).observe(viewer);
    controls.addEventListener("change", () => {
      if (state.cut && !state.animation) updateComputedSection(true);
    });

    function animate(now) {
      requestAnimationFrame(animate);
      controls.update();
      labelGroup.children.forEach((label) => {
        label.quaternion.copy(camera.quaternion);
      });

      if (state.animation) {
        const progress = Math.min(1, (now - state.animation.start) / state.animation.duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const distance = state.animation.from + (state.animation.to - state.animation.from) * eased;
        cuttingPlane.position.copy(state.animation.normal.clone().multiplyScalar(distance));
        planeMaterial.opacity = 0.42 + Math.sin(progress * Math.PI) * 0.22;
        updateComputedSection(true);
        if (progress >= 1) {
          state.animation = null;
          cuttingPlane.position.set(0, 0, 0);
          planeMaterial.opacity = 0.5;
          finishCut();
        }
      }

      if (state.splitAnimation) {
        const splitProgress = Math.min(1, (now - state.splitAnimation.start) / state.splitAnimation.duration);
        const splitEased = 1 - Math.pow(1 - splitProgress, 3);
        updateSplitResult(splitEased);
        if (splitProgress >= 1) {
          updateSplitResult(1);
          state.splitAnimation = null;
        }
      }

      renderer.render(scene, camera);
    }

    buildSolid();
    requestAnimationFrame(animate);
  </script>
  <script src="../../assets/tool-home-nav.js"></script>
</body>
</html>
