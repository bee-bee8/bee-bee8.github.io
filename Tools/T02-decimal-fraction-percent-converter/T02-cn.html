    .numberline {

      height: 92px;

    .numberline-track,

      position: absolute;
      top: 36px;
      left: 0;
      height: 18px;

    }

    .numberline-track {
      width: 100%;
      background: var(--empty);

    }

    .numberline-fill {
      width: 0;
      background: linear-gradient(90deg, #77b7ff, var(--accent));

    .marker {
      position: absolute;

      left: 0;

      background: var(--accent);

      font-size: 0.95rem;

      background: #9fb0c6;

    .fraction-row {

      gap: 10px;

      font-weight: 900;
    }

    .pie-area {
      display: grid;

    .pie-wrap {
      display: grid;
      gap: 8px;
      justify-items: center;

    .pie {
      --angle: 0deg;
      width: min(142px, 34vw);
      aspect-ratio: 1;
      border: 4px solid #9a7b4f;
      border-radius: 50%;

  <script>
    "use strict";

    const state = {
      value: 0.25
    };

    const els = {
      slider: document.getElementById("percentSlider"),
      sliderReadout: document.getElementById("sliderReadout"),
      decimalInput: document.getElementById("decimalInput"),
      fractionWholeInput: document.getElementById("fractionWholeInput"),
      fractionNumeratorInput: document.getElementById("fractionNumeratorInput"),
      fractionDenominatorInput: document.getElementById("fractionDenominatorInput"),
      percentInput: document.getElementById("percentInput"),
      status: document.getElementById("status"),
      decimalLabel: document.getElementById("decimalLabel"),
      fractionLabel: document.getElementById("fractionLabel"),
      properFractionRow: document.getElementById("properFractionRow"),
      properFractionDisplay: document.getElementById("properFractionDisplay"),
      mixedFractionRow: document.getElementById("mixedFractionRow"),
      mixedFractionDisplay: document.getElementById("mixedFractionDisplay"),
      improperFractionRow: document.getElementById("improperFractionRow"),
      improperFractionDisplay: document.getElementById("improperFractionDisplay"),
      integerFractionRow: document.getElementById("integerFractionRow"),
      integerFractionDisplay: document.getElementById("integerFractionDisplay"),
      percentLabel: document.getElementById("percentLabel"),
      numberlineFill: document.getElementById("numberlineFill"),
      numberlineMarker: document.getElementById("numberlineMarker"),
      fractionBars: document.getElementById("fractionBars"),
      pies: document.getElementById("pies"),
      randomButton: document.getElementById("randomButton"),
      resetButton: document.getElementById("resetButton")
    };

    function clampValue(value) {
      if (Number.isNaN(value) || !Number.isFinite(value)) {
        return { value: state.value, clamped: false, invalid: true };
      }
      const clamped = Math.min(2, Math.max(0, value));
      return { value: clamped, clamped: clamped !== value, invalid: false };
    }

    function gcd(a, b) {
      let x = Math.abs(Math.round(a));
      let y = Math.abs(Math.round(b));
      while (y !== 0) {
        const next = x % y;
        x = y;
        y = next;
      }
      return x || 1;
    }

    function decimalToFraction(value) {
      const fixed = Number(value.toFixed(3));
      const text = fixed.toString();
      const decimalPlaces = text.includes(".") ? text.split(".")[1].length : 0;
      const denominator = Math.pow(10, decimalPlaces);
      const numerator = Math.round(fixed * denominator);
      const divisor = gcd(numerator, denominator);
      return {
        numerator: numerator / divisor,
        denominator: denominator / divisor
      };
    }

    function parseFractionInput(input) {
      const text = input.trim().replace(/\s+/g, " ");
      if (!text) return null;

      const integerPattern = /^\d+$/;
      const fractionPattern = /^(\d+)\/(\d+)$/;
      const mixedPattern = /^(\d+)\s+(\d+)\/(\d+)$/;

      if (integerPattern.test(text)) {
        return Number(text);
      }

      let match = text.match(fractionPattern);
      if (match) {
        const numerator = Number(match[1]);
        const denominator = Number(match[2]);
        if (denominator === 0) return null;
        return numerator / denominator;
      }

      match = text.match(mixedPattern);
      if (match) {
        const whole = Number(match[1]);
        const numerator = Number(match[2]);
        const denominator = Number(match[3]);
        if (denominator === 0) return null;
        return whole + numerator / denominator;
      }

      return null;
    }

    function parsePercentInput(input) {
      const text = input.trim().replace("%", "");
      if (!text) return null;
      if (!/^\d+(\.\d+)?$/.test(text)) return null;
      return Number(text) / 100;
    }

    function parseDecimalInput(input) {
      const text = input.trim();
      if (!text) return null;
      if (!/^\d+(\.\d+)?$/.test(text)) return null;
      return Number(text);
    }

    function formatDecimal(value) {
      return Number(value.toFixed(3)).toString();
    }

    function formatPercent(value) {
      return Number((value * 100).toFixed(1)).toString().replace(/\.0$/, "") + "%";
    }

    function formatImproperFraction(fraction) {
      if (fraction.denominator === 1) return String(fraction.numerator);
      return `${fraction.numerator}/${fraction.denominator}`;
    }

    function formatMixedFraction(fraction) {
      const mixed = getMixedParts(fraction);
      if (mixed.denominator === 1) return String(mixed.whole);
      if (mixed.whole === 0) return `${mixed.numerator}/${mixed.denominator}`;
      return `${mixed.whole} ${mixed.numerator}/${mixed.denominator}`;
    }

    function getMixedParts(fraction) {
      const { numerator, denominator } = fraction;
      if (denominator === 1) {
        return { whole: numerator, numerator: 0, denominator: 1 };
      }
      const whole = Math.floor(numerator / denominator);
      const remainder = numerator % denominator;
      return { whole, numerator: remainder, denominator };
    }

    function renderFractionDisplay(numerator, denominator) {
      if (denominator === 1) {
        const integer = document.createElement("span");
        integer.className = "whole";
        integer.textContent = String(numerator);
        integer.setAttribute("data-fraction-text", String(numerator));
        return integer;
      }

      const fraction = document.createElement("span");
      fraction.className = "fraction";
      fraction.setAttribute("aria-label", `${numerator}/${denominator}`);
      fraction.setAttribute("data-fraction-text", `${numerator}/${denominator}`);

      const top = document.createElement("span");
      top.className = "numerator";
      top.textContent = String(numerator);

      const bar = document.createElement("span");
      bar.className = "bar";
      bar.setAttribute("aria-hidden", "true");

      const bottom = document.createElement("span");
      bottom.className = "denominator";
      bottom.textContent = String(denominator);

      fraction.append(top, bar, bottom);
      return fraction;
    }

    function renderMixedNumberDisplay(whole, numerator, denominator) {
      if (denominator === 1 || numerator === 0) {
        return renderFractionDisplay(whole, 1);
      }
      if (whole === 0) {
        return renderFractionDisplay(numerator, denominator);
      }

      const mixed = document.createElement("span");
      mixed.className = "mixed-number";
      mixed.setAttribute("aria-label", `${whole} ${numerator}/${denominator}`);
      mixed.setAttribute("data-fraction-text", `${whole} ${numerator}/${denominator}`);

      const wholeEl = document.createElement("span");
      wholeEl.className = "whole";
      wholeEl.textContent = String(whole);

      mixed.append(wholeEl, renderFractionDisplay(numerator, denominator));
      return mixed;
    }

    function renderUnavailableDisplay() {
      const unavailable = document.createElement("span");
      unavailable.className = "whole";
      unavailable.textContent = "/";
      unavailable.setAttribute("aria-label", "不適用");
      unavailable.setAttribute("data-fraction-text", "/");
      return unavailable;
    }

    function getFractionClassification(fraction) {
      if (fraction.denominator === 1) {
        return {
          type: "integer",
          integer: fraction,
          proper: null,
          improper: null,
          mixed: null
        };
      }

      if (fraction.numerator < fraction.denominator) {
        return {
          type: "proper",
          integer: null,
          proper: fraction,
          improper: null,
          mixed: null
        };
      }

      return {
        type: "improper-mixed",
        integer: null,
        proper: null,
        improper: fraction,
        mixed: getMixedParts(fraction)
      };
    }

    function setFractionDisplay(target, node) {
      target.textContent = "";
      target.appendChild(node);
    }

    function setFractionRowVisible(row, isVisible) {
      row.hidden = !isVisible;
    }

    function renderFractionClassification(fraction) {
      const classification = getFractionClassification(fraction);
      const isInteger = classification.type === "integer";

      setFractionRowVisible(els.properFractionRow, !isInteger);
      setFractionRowVisible(els.improperFractionRow, !isInteger);
      setFractionRowVisible(els.mixedFractionRow, !isInteger);
      setFractionRowVisible(els.integerFractionRow, isInteger);

      if (isInteger) {
        setFractionDisplay(els.properFractionDisplay, renderUnavailableDisplay());
        setFractionDisplay(els.improperFractionDisplay, renderUnavailableDisplay());
        setFractionDisplay(els.mixedFractionDisplay, renderUnavailableDisplay());
        setFractionDisplay(els.integerFractionDisplay, renderFractionDisplay(fraction.numerator, 1));
        return;
      }

      setFractionDisplay(
        els.properFractionDisplay,
        classification.proper
          ? renderFractionDisplay(classification.proper.numerator, classification.proper.denominator)
          : renderUnavailableDisplay()
      );
      setFractionDisplay(
        els.improperFractionDisplay,
        classification.improper
          ? renderFractionDisplay(classification.improper.numerator, classification.improper.denominator)
          : renderUnavailableDisplay()
      );
      setFractionDisplay(
        els.mixedFractionDisplay,
        classification.mixed
          ? renderMixedNumberDisplay(classification.mixed.whole, classification.mixed.numerator, classification.mixed.denominator)
          : renderUnavailableDisplay()
      );
    }

    function updateFractionInputFields(mixed) {
      if (mixed.denominator === 1) {
        els.fractionWholeInput.value = String(mixed.whole);
        els.fractionNumeratorInput.value = "";
        els.fractionDenominatorInput.value = "";
        return;
      }
      els.fractionWholeInput.value = mixed.whole > 0 ? String(mixed.whole) : "";
      els.fractionNumeratorInput.value = String(mixed.numerator);
      els.fractionDenominatorInput.value = String(mixed.denominator);
    }

    function parseFractionFields() {
      const wholeText = els.fractionWholeInput.value.trim();
      const numeratorText = els.fractionNumeratorInput.value.trim();
      const denominatorText = els.fractionDenominatorInput.value.trim();
      const integerPattern = /^\d+$/;

      if (wholeText && !integerPattern.test(wholeText)) return null;
      if (numeratorText && !integerPattern.test(numeratorText)) return null;
      if (denominatorText && !integerPattern.test(denominatorText)) return null;

      const whole = wholeText ? Number(wholeText) : 0;
      if (!numeratorText && !denominatorText) return whole;
      if (!numeratorText || !denominatorText) return null;

      const numerator = Number(numeratorText);
      const denominator = Number(denominatorText);
      if (denominator === 0) return null;
      return whole + numerator / denominator;
    }

    function renderNumberLine(value) {
      const percent = (value / 2) * 100;
      els.numberlineFill.style.width = `${percent}%`;
      els.numberlineMarker.style.left = `${percent}%`;
    }

    function renderFractionBars(fraction) {
      const { numerator, denominator } = fraction;
      els.fractionBars.textContent = "";

      const wholeBars = Math.floor(numerator / denominator);
      const remainder = numerator % denominator;
      const barCount = Math.max(1, wholeBars + (remainder > 0 ? 1 : 0));

      for (let barIndex = 0; barIndex < barCount; barIndex += 1) {
        const filledParts = barIndex < wholeBars ? denominator : (barIndex === wholeBars ? remainder : 0);
        const bar = document.createElement("div");
        bar.className = "unit-bar";
        bar.style.setProperty("--parts", denominator);
        bar.setAttribute("aria-label", `第 ${barIndex + 1} 條：${filledParts}/${denominator}`);

        for (let part = 0; part < denominator; part += 1) {
          const piece = document.createElement("div");
          piece.className = "unit-piece" + (part < filledParts ? " filled" : "");
          bar.appendChild(piece);
        }

        const label = document.createElement("div");
        label.className = "bar-label";
        if (filledParts === denominator) {
          label.textContent = "1 個完整整體";
        } else {
          label.appendChild(renderFractionDisplay(filledParts, denominator));
        }

        els.fractionBars.appendChild(bar);
        els.fractionBars.appendChild(label);
      }
    }

    function renderPieCharts(value) {
      const totalPercent = Math.round(value * 1000) / 10;
      const fullPies = Math.floor(totalPercent / 100);
      const remainder = totalPercent - fullPies * 100;
      const pieCount = Math.max(1, fullPies + (remainder > 0 ? 1 : 0));
      els.pies.textContent = "";

      for (let index = 0; index < pieCount; index += 1) {
        const percent = index < fullPies ? 100 : (index === fullPies ? remainder : 0);
        const wrap = document.createElement("div");
        wrap.className = "pie-wrap";

        const pie = document.createElement("div");
        pie.className = "pie";
        pie.style.setProperty("--angle", `${percent * 3.6}deg`);
        pie.setAttribute("aria-label", `圓圖 ${index + 1}：${Number(percent.toFixed(1))}%`);

        const label = document.createElement("div");
        label.className = "pie-label";
        label.textContent = percent === 100 ? "100%" : `${Number(percent.toFixed(1))}%`;

        wrap.appendChild(pie);
        wrap.appendChild(label);
        els.pies.appendChild(wrap);
      }
    }

    function setStatus(message, type) {
      els.status.textContent = message;
      els.status.className = "status" + (type ? ` ${type}` : "");
    }

    function updateAll(message, type) {
      const value = state.value;
      const fraction = decimalToFraction(value);
      const mixed = getMixedParts(fraction);
      const decimalText = formatDecimal(value);
      const percentText = formatPercent(value);
      const mixedText = formatMixedFraction(fraction);

      els.slider.value = Math.round(value * 100);
      els.sliderReadout.textContent = percentText;
      els.decimalInput.value = decimalText;
      updateFractionInputFields(mixed);
      els.percentInput.value = percentText;

      els.decimalLabel.textContent = `小數：${decimalText}`;
      els.fractionLabel.textContent = "";
      els.fractionLabel.append("分數：", renderMixedNumberDisplay(mixed.whole, mixed.numerator, mixed.denominator));
      renderFractionClassification(fraction);
      els.percentLabel.textContent = `百分數：${percentText}`;

      renderNumberLine(value);
      renderFractionBars(fraction);
      renderPieCharts(value);

      if (message) {
        setStatus(message, type);
      } else {
        setStatus(`目前顯示 ${percentText}。`, "");
      }
    }

    function applyValue(rawValue, sourceLabel) {
      const result = clampValue(rawValue);
      if (result.invalid) {
        updateAll("請輸入 0 至 2 的小數、分數或 0% 至 200% 的百分數。", "error");
        return false;
      }
      state.value = Number(result.value.toFixed(3));
      if (result.clamped) {
        updateAll(`${sourceLabel} 已超出範圍，已自動限制在 0 至 2。`, "clamped");
      } else {
        updateAll();
      }
      return true;
    }

    function commitInput(inputElement, parser, sourceLabel) {
      const parsed = parser(inputElement.value);
      if (parsed === null) {
        updateAll("請輸入 0 至 2 的小數、分數或 0% 至 200% 的百分數。", "error");
        return;
      }
      applyValue(parsed, sourceLabel);
    }

    function commitFractionFields() {
      const parsed = parseFractionFields();
      if (parsed === null) {
        updateAll("請輸入 0 至 2 的小數、分數或 0% 至 200% 的百分數。", "error");
        return;
      }
      applyValue(parsed, "分數");
    }

    function wireCommittedInput(inputElement, parser, sourceLabel) {
      inputElement.addEventListener("change", () => commitInput(inputElement, parser, sourceLabel));
      inputElement.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          inputElement.blur();
          commitInput(inputElement, parser, sourceLabel);
        }
      });
    }

    function runTests() {
      const tests = [
        { value: 0, improper: "0", mixed: "0", percent: "0%", classification: "integer" },
        { value: 0.25, improper: "1/4", mixed: "1/4", percent: "25%", classification: "proper" },
        { value: 0.5, improper: "1/2", mixed: "1/2", percent: "50%", classification: "proper" },
        { value: 1, improper: "1", mixed: "1", percent: "100%", classification: "integer" },
        { value: 1.25, improper: "5/4", mixed: "1 1/4", percent: "125%", classification: "improper-mixed" },
        { value: 1.5, improper: "3/2", mixed: "1 1/2", percent: "150%", classification: "improper-mixed" },
        { value: 1.75, improper: "7/4", mixed: "1 3/4", percent: "175%", classification: "improper-mixed" },
        { value: 2, improper: "2", mixed: "2", percent: "200%", classification: "integer" }
      ];

      tests.forEach((test) => {
        const fraction = decimalToFraction(test.value);
        console.assert(formatImproperFraction(fraction) === test.improper, `${test.value} improper fraction failed`);
        console.assert(formatMixedFraction(fraction) === test.mixed, `${test.value} mixed fraction failed`);
        console.assert(formatPercent(test.value) === test.percent, `${test.value} percent failed`);
        console.assert(getFractionClassification(fraction).type === test.classification, `${test.value} classification failed`);
      });

      console.assert(parseFractionInput("1/4") === 0.25, "parse 1/4 failed");
      console.assert(parseFractionInput("1 1/4") === 1.25, "parse 1 1/4 failed");
      console.assert(parsePercentInput("125%") === 1.25, "parse 125% failed");
      console.log("ALL TESTS PASSED");
    }

    els.slider.addEventListener("input", () => {
      state.value = Number(els.slider.value) / 100;
      updateAll();
    });

    wireCommittedInput(els.decimalInput, parseDecimalInput, "小數");
    wireCommittedInput(els.percentInput, parsePercentInput, "百分數");

    [els.fractionWholeInput, els.fractionNumeratorInput, els.fractionDenominatorInput].forEach((inputElement) => {
      inputElement.addEventListener("change", commitFractionFields);
      inputElement.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          inputElement.blur();
          commitFractionFields();
        }
      });
    });

    document.querySelectorAll(".quick-button").forEach((button) => {
      button.addEventListener("click", () => applyValue(Number(button.dataset.value), "快捷按鈕"));
    });

    els.resetButton.addEventListener("click", () => applyValue(0.25, "重設"));
    els.randomButton.addEventListener("click", () => {
      const commonPercents = [0, 10, 20, 25, 33, 40, 50, 60, 66, 75, 80, 100, 110, 125, 150, 175, 200];
      const nextPercent = commonPercents[Math.floor(Math.random() * commonPercents.length)];
      applyValue(nextPercent / 100, "隨機出題");
    });

    updateAll();
    runTests();
  </script>

      };

      Object.entries(metaValues).forEach(([name, content]) => {
        let meta = document.head.querySelector(`meta[name="${name}"]`);
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", name);
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", content);
      });
    }

    function upsertLDLBodyAttributes(record) {
      const attrs = {
        "data-ldl-product-name": record.productName,
        "data-ldl-product-name-en": record.productNameEn,
        "data-ldl-product-code": record.productCode,
        "data-ldl-tool-id": record.toolId,
        "data-ldl-module-id": record.moduleId,
        "data-ldl-build-id": record.buildId,
        "data-ldl-fingerprint": record.fingerprint,
        "data-ldl-marker-signature": record.markerSignature
      };

      Object.entries(attrs).forEach(([name, value]) => {
        document.body.setAttribute(name, value);
      });
    }

    function upsertLDLJsonRecord(record) {
      let script = document.getElementById("ldl-source-reference");
      if (!script) {
        script = document.createElement("script");
        script.type = "application/json";
        script.id = "ldl-source-reference";
        document.body.appendChild(script);
      }
      script.textContent = JSON.stringify(record, null, 2);
    }

    function upsertLDLHiddenDomReference(record) {
      const hidden = getOrCreateLDLElement("div", "ldl-hidden-source-reference", document.body);
      hidden.className = "ldl-offscreen-source-reference";
      hidden.setAttribute("aria-hidden", "true");
      hidden.setAttribute("data-ldl-product-name", record.productName);
      hidden.setAttribute("data-ldl-product-name-en", record.productNameEn);
      hidden.setAttribute("data-ldl-product-code", record.productCode);
      hidden.setAttribute("data-ldl-tool-id", record.toolId);
      hidden.setAttribute("data-ldl-module-id", record.moduleId);
      hidden.setAttribute("data-ldl-company", record.company);
      hidden.setAttribute("data-ldl-author", record.author);
      hidden.setAttribute("data-ldl-release-year", String(record.releaseYear));
      hidden.setAttribute("data-ldl-version", record.version);
      hidden.setAttribute("data-ldl-build-id", record.buildId);
      hidden.setAttribute("data-ldl-fingerprint", record.fingerprint);
      hidden.setAttribute("data-ldl-marker-signature", record.markerSignature);
      hidden.textContent = [
        "LDL Source Reference",
        record.productName,
        record.productNameEn,
        record.productCode,
        record.toolId,
        record.moduleId,
        record.company,
        record.author,
        String(record.releaseYear),
        record.version,
        record.buildId,
        record.fingerprint,
        record.markerSignature,
        record.license
      ].join(" | ");
    }

    function upsertLDLSvgMetadata(record) {
      let svg = document.getElementById("ldl-hidden-svg-source-reference");
      if (!svg) {
        svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = "ldl-hidden-svg-source-reference";
        document.body.appendChild(svg);
      }
      svg.setAttribute("class", "ldl-offscreen-source-reference");
      svg.setAttribute("width", "0");
      svg.setAttribute("height", "0");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");

      let metadata = svg.querySelector("metadata");
      if (!metadata) {
        metadata = document.createElementNS("http://www.w3.org/2000/svg", "metadata");
        svg.appendChild(metadata);
      }
      metadata.textContent = JSON.stringify(record);
    }

    function upsertLDLVisibleWatermark() {
      const watermark = getOrCreateLDLElement("div", "ldl-visible-watermark", document.body);
      watermark.className = "ldl-visible-watermark";
      watermark.setAttribute("aria-hidden", "true");

      let text = watermark.querySelector("span");
      if (!text) {
        text = document.createElement("span");
        watermark.appendChild(text);
      }
      text.textContent = LDL_VISIBLE_WATERMARK_TEXT;
    }

    function getOrCreateLDLElement(tagName, id, parent) {
      let element = document.getElementById(id);
      if (!element) {
        element = document.createElement(tagName);
        element.id = id;
        parent.appendChild(element);
      }
      return element;
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initLDLSourceReference, { once: true });
    } else {
      initLDLSourceReference();
    }
  </script>
  <script src="../../assets/tool-home-nav.js"></script>
</body>
</html>
