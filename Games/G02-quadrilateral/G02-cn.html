      fullscreenButtons.forEach((button) => button.addEventListener("click", enterFullscreen));
      exitFullscreenButtons.forEach((button) => button.addEventListener("click", exitFullscreen));
      document.addEventListener("fullscreenchange", updateFullscreenButtons);
      updateMenuValidation();
      updateFullscreenButtons();
    }

    function getMenuSettings() {
      const selectedTypes = Array.from(document.querySelectorAll("input[name='shapeType']:checked")).map((input) => input.value);
      const mode = document.querySelector("input[name='mode']:checked").value;
      const assistEnabled = assistInput.checked;
      const duration = getDurationSeconds(true);
      return { selectedTypes, mode, assistEnabled, duration };
    }

    function getDurationSeconds(normalize) {
      if (normalize) normalizeTimeInputs();
      const minutes = Number(minutesInput.value);
      const seconds = Number(secondsInput.value);
      if (!Number.isFinite(minutes) || !Number.isFinite(seconds)) return NaN;
      if (minutes < 0 || seconds < 0 || seconds > 59) return NaN;
      return Math.floor(minutes) * 60 + Math.floor(seconds);
    }

    function normalizeTimeInputs() {
      const minutes = clampInt(minutesInput.value, 0, 99, 0);
      const seconds = clampInt(secondsInput.value, 0, 59, 0);
      minutesInput.value = String(minutes);
      secondsInput.value = String(seconds);
    }

    function setDurationInputs(totalSeconds) {
      const safeSeconds = clampInt(totalSeconds, 1, 5999, 60);
      minutesInput.value = String(Math.floor(safeSeconds / 60));
      secondsInput.value = String(safeSeconds % 60);
    }

    function updateTimePresetState() {
      const duration = getDurationSeconds(false);
      document.querySelectorAll(".time-preset").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.duration) === duration);
      });
    }

    function updateMenuValidation() {
      const selectedTypes = Array.from(document.querySelectorAll("input[name='shapeType']:checked")).map((input) => input.value);
      const duration = getDurationSeconds(false);
      const durationValid = Number.isFinite(duration) && duration >= 1;
      const valid = selectedTypes.length >= 2 && durationValid;
      startButton.disabled = !valid;
      if (selectedTypes.length < 2) {
        menuError.textContent = "請至少選擇 2 種圖形才可以開始。";
      } else if (!durationValid) {
        menuError.textContent = "請輸入有效時間，例如 1 分 : 00 秒。";
      } else {
        menuError.textContent = "";
      }
      updateTimePresetState();
    }

    function startGame() {
      const settings = getMenuSettings();
      if (settings.selectedTypes.length < 2 || settings.duration < 1) {
        updateMenuValidation();
        return;
      }

      cancelAnimationFrame(gameState.animationId);
      playBgmFromStart();
      gameState.screen = "playing";
      gameState.mode = settings.mode;
      gameState.selectedTypes = settings.selectedTypes;
      gameState.assistEnabled = settings.assistEnabled;
      gameState.duration = settings.duration;
      gameState.timeRemaining = settings.duration;
      gameState.targetType = pickRandom(settings.selectedTypes);
      setDuoTargets();
      gameState.shapes = [];
      gameState.effects = [];
      gameState.score = 0;
      gameState.redScore = 0;
      gameState.blueScore = 0;
      gameState.correctCount = 0;
      gameState.roundNumber += 1;
      gameState.roundStartedAt = formatLocalDateTime(new Date());
      gameState.spawnTimer = 0;
      gameState.targetTimer = 0;
      gameState.lastTime = performance.now();

      menuScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      hud.classList.remove("hidden");
      backToSettingsButton.classList.remove("hidden");
      confettiLayer.innerHTML = "";
      updateHud(true);

      const openingShapes = gameState.mode === "duo" ? 6 : 5;
      for (let i = 0; i < openingShapes; i += 1) {
        spawnShape(i % 2 === 0 ? "left" : "right", -Math.random() * gameState.height * 0.5);
      }

      gameState.animationId = requestAnimationFrame(updateGame);
    }

    function playBgmFromStart() {
      if (isMutedPreviewMode) return;

      bgmAudio.pause();
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(() => {});
    }

    function stopBgm() {
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
    }

    function setDuoTargets() {
      gameState.redTargetType = pickRandom(gameState.selectedTypes);
      const blueOptions = gameState.selectedTypes.filter((type) => type !== gameState.redTargetType);
      gameState.blueTargetType = pickRandom(blueOptions.length ? blueOptions : gameState.selectedTypes);
    }

    function getTargetForSide(side) {
      if (gameState.mode !== "duo") return gameState.targetType;
      return side === "left" ? gameState.redTargetType : gameState.blueTargetType;
    }

    function spawnShape(preferredSide, startY) {
      const side = gameState.mode === "duo" ? (preferredSide || (Math.random() < 0.5 ? "left" : "right")) : "single";
      const sideTarget = getTargetForSide(side);
      const type = Math.random() < config.targetBias ? sideTarget : pickRandom(gameState.selectedTypes);
      const color = config.typeStyles[type].fill;
      const size = random(config.shapeMinSize, config.shapeMaxSize);
      const speedFactor = random(config.objectSpeedMultiplierMin, config.objectSpeedMultiplierMax);
      const shape = {
        type,
        x: 0,
        y: typeof startY === "number" ? startY : -size - random(0, 120),
        size,
        width: size,
        height: size,
        points: null,
        rotation: random(0, Math.PI * 2),
        speed: random(config.baseSpeedMin, config.baseSpeedMax) * speedFactor,
        speedFactor,
        color,
        side,
        radius: size * 0.76,
        flash: 0
      };

      setShapeGeometry(shape);
      shape.x = randomXForShape(shape, side);
      gameState.shapes.push(shape);
      return shape;
    }

    function setShapeGeometry(shape) {
      const s = shape.size;

      if (shape.type === "square") {
        shape.width = s;
        shape.height = s;
        shape.radius = s * 0.74;
        return;
      }

      if (shape.type === "rectangle") {
        const shortSide = random(s * 0.68, s * 0.82);
        const longSide = shortSide * random(1.6, 2.08);
        shape.width = longSide;
        shape.height = shortSide;
        shape.radius = Math.hypot(shape.width, shape.height) / 2;
        return;
      }

      if (shape.type === "rhombus") {
        const width = random(s * 1.18, s * 1.48);
        const height = width * random(0.48, 0.62);
        shape.points = [
          { x: 0, y: -height / 2 },
          { x: width / 2, y: 0 },
          { x: 0, y: height / 2 },
          { x: -width / 2, y: 0 }
        ];
        shape.width = width;
        shape.height = height;
        shape.radius = Math.hypot(width, height) / 2;
        return;
      }

      if (shape.type === "triangle") {
        const width = random(s * 0.95, s * 1.32);
        const height = random(s * 0.9, s * 1.22);
        const apexOffset = random(-width * 0.18, width * 0.18);
        shape.points = [
          { x: apexOffset, y: -height / 2 },
          { x: width / 2, y: height / 2 },
          { x: -width / 2, y: height / 2 }
        ];
        shape.width = width;
        shape.height = height;
        shape.radius = Math.max(width, height) * 0.7;
        return;
      }

      if (shape.type === "trapezoid") {
        const bottom = random(s * 1.1, s * 1.45);
        const top = bottom * random(0.52, 0.72);
        const height = random(s * 0.72, s * 0.94);
        const shift = random(-bottom * 0.12, bottom * 0.12);
        shape.points = [
          { x: -top / 2 + shift, y: -height / 2 },
          { x: top / 2 + shift, y: -height / 2 },
          { x: bottom / 2, y: height / 2 },
          { x: -bottom / 2, y: height / 2 }
        ];
        shape.width = bottom;
        shape.height = height;
        shape.radius = Math.hypot(bottom, height) / 2;
        return;
      }

      if (shape.type === "parallelogram") {
        const width = random(s * 1.1, s * 1.42);
        const height = random(s * 0.72, s * 0.92);
        const slant = random(width * 0.18, width * 0.32) * (Math.random() < 0.5 ? -1 : 1);
        shape.points = [
          { x: -width / 2 + slant, y: -height / 2 },
          { x: width / 2 + slant, y: -height / 2 },
          { x: width / 2 - slant, y: height / 2 },
          { x: -width / 2 - slant, y: height / 2 }
        ];
        shape.width = width + Math.abs(slant);
        shape.height = height;
        shape.radius = Math.hypot(shape.width, height) / 2;
      }
    }

    function updateGame(timestamp) {
      if (gameState.screen !== "playing") return;

      const delta = clamp((timestamp - gameState.lastTime) / 1000, 0, 0.05);
      gameState.lastTime = timestamp;
      gameState.timeRemaining -= delta;

      if (gameState.timeRemaining <= 0) {
        gameState.timeRemaining = 0;
        updateHud();
        drawGame();
        endGame();
        return;
      }

      const level = Math.floor(gameState.correctCount / 5);
      const speedMultiplier = 1 + level * config.speedBoostPerLevel;
      const maxShapes = Math.min(config.finalMaxShapes, config.initialMaxShapes + level);
      const spawnInterval = Math.max(config.minSpawnInterval, config.baseSpawnInterval - level * 65);

      gameState.spawnTimer += delta * 1000;
      gameState.targetTimer += delta * 1000;

      if (gameState.targetTimer >= config.targetSwitchInterval) {
        changeTarget();
      }

      if (gameState.spawnTimer >= spawnInterval && gameState.shapes.length < maxShapes) {
        gameState.spawnTimer = 0;
        if (gameState.mode === "duo") {
          spawnShape(balanceNextSide());
        } else {
          spawnShape();
        }
      }

      gameState.shapes.forEach((shape) => {
        shape.y += shape.speed * speedMultiplier * delta;
        if (shape.flash > 0) {
          shape.flash -= delta * 1000;
        }
      });

      gameState.shapes = gameState.shapes.filter((shape) => shape.y - shape.radius < gameState.height + 26);
      gameState.effects.forEach((effect) => {
        effect.life -= delta * 1000;
        effect.y += effect.vy * delta;
      });
      gameState.effects = gameState.effects.filter((effect) => effect.life > 0);

      updateHud();
      drawGame();
      gameState.animationId = requestAnimationFrame(updateGame);
    }

    function drawGame() {
      ctx.clearRect(0, 0, gameState.width, gameState.height);
      drawBackgroundDetails();

      if (gameState.mode === "duo") {
        drawTeamAreas();
      }

      gameState.shapes.forEach(drawShape);
      gameState.effects.forEach(drawEffect);
    }

    function drawBackgroundDetails() {
      ctx.save();
      const top = config.safeTop + 10;

      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "#7fb4d9";
      ctx.lineWidth = 1.5;
      for (let x = 40; x < gameState.width; x += 92) {
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x + 26, top);
        ctx.moveTo(x + 46, top + 48);
        ctx.lineTo(x + 76, top + 48);
        ctx.stroke();
      }

      ctx.globalAlpha = 0.1;
      ctx.fillStyle = "#1f6fbe";
      for (let x = 34; x < gameState.width; x += 120) {
        for (let y = top + 32; y < gameState.height; y += 110) {
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.globalAlpha = 0.12;
      ctx.fillStyle = "#67d6a2";
      ctx.beginPath();
      ctx.moveTo(0, gameState.height * 0.78);
      ctx.bezierCurveTo(gameState.width * 0.24, gameState.height * 0.72, gameState.width * 0.43, gameState.height * 0.86, gameState.width, gameState.height * 0.77);
      ctx.lineTo(gameState.width, gameState.height);
      ctx.lineTo(0, gameState.height);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = 0.13;
      ctx.strokeStyle = "#8a6bd8";
      ctx.lineWidth = 2;
      drawSoftPolygon(gameState.width * 0.84, top + 92, 34, 4, Math.PI / 4);
      drawSoftPolygon(gameState.width * 0.18, gameState.height * 0.68, 30, 3, -Math.PI / 2);
      ctx.restore();
    }

    function drawSoftPolygon(x, y, radius, sides, rotation) {
      ctx.beginPath();
      for (let i = 0; i < sides; i += 1) {
        const angle = rotation + (Math.PI * 2 * i) / sides;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.closePath();
      ctx.stroke();
    }

    function drawTeamAreas() {
      const mid = gameState.width / 2;
      ctx.save();
      ctx.fillStyle = "rgba(228, 84, 84, 0.075)";
      ctx.fillRect(0, 0, mid, gameState.height);
      ctx.fillStyle = "rgba(38, 118, 217, 0.075)";
      ctx.fillRect(mid, 0, mid, gameState.height);

      ctx.setLineDash([14, 12]);
      ctx.strokeStyle = "rgba(23, 32, 51, 0.36)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(mid, config.safeTop + 6);
      ctx.lineTo(mid, gameState.height);
      ctx.stroke();
      ctx.setLineDash([]);

      drawTeamLabel("紅隊", gameState.redScore, mid * 0.5, config.safeTop + 34, "#c83d46");
      drawTeamLabel("藍隊", gameState.blueScore, mid + mid * 0.5, config.safeTop + 34, "#1f5bb9");
      ctx.restore();
    }

    function drawTeamLabel(text, score, x, y, color) {
      return;
    }

    function drawShape(shape) {
      ctx.save();
      ctx.translate(shape.x, shape.y);
      ctx.rotate(shape.rotation);
      ctx.shadowColor = "rgba(34, 45, 70, 0.18)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 8;

      ctx.beginPath();
      buildShapePath(shape);
      ctx.fillStyle = shape.flash > 0 ? "#ff6f75" : shape.color;
      ctx.strokeStyle = "#26364f";
      ctx.lineWidth = 3.5;
      ctx.lineJoin = "round";
      ctx.fill();
      ctx.shadowColor = "transparent";
      ctx.stroke();

      if (shape.flash > 0) {
        ctx.strokeStyle = "rgba(205, 42, 55, 0.7)";
        ctx.lineWidth = 7;
        ctx.beginPath();
        buildShapePath(shape);
        ctx.stroke();
      }

      ctx.restore();
    }

    function buildShapePath(shape) {
      if (shape.type === "rectangle" || shape.type === "square") {
        ctx.rect(-shape.width / 2, -shape.height / 2, shape.width, shape.height);
        return;
      }

      shape.points.forEach((point, index) => {
        if (index === 0) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      });
      ctx.closePath();
    }

    function handlePointer(event) {
      if (gameState.screen !== "playing") return;
      event.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const hitIndex = findHitShapeIndex(x, y);

      if (hitIndex === -1) return;

      const shape = gameState.shapes[hitIndex];
      const expectedType = getTargetForSide(shape.side);
      const isCorrect = isShapeAcceptedForTarget(shape.type, expectedType);

      if (isCorrect) {
        gameState.shapes.splice(hitIndex, 1);
        addCorrectScore(shape, x, y);
      } else {
        shape.flash = config.wrongFlashDuration;
        addEffect(x, y, "再試試", "#d84654", -38, "wrong");
      }

      recordLearningInteraction(shape, expectedType, isCorrect);
    }

    function isShapeAcceptedForTarget(shapeType, targetType) {
      if (shapeType === targetType) return true;
      return targetType === "rectangle" && shapeType === "square";
    }

    function addCorrectScore(shape, x, y) {
      if (gameState.mode === "duo") {
        if (shape.side === "left") {
          gameState.redScore += 1;
        } else {
          gameState.blueScore += 1;
        }
      } else {
        gameState.score += 1;
      }

      gameState.correctCount += 1;
      addEffect(x, y, "+1", "#0e8d66", -58, "correct");
      addSparkles(x, y);
      updateHud();
    }

    function recordLearningInteraction(shape, expectedType, isCorrect) {
      const team = getTeamNameForSide(shape.side);
      const elapsedSeconds = Math.max(0, Math.round(gameState.duration - gameState.timeRemaining));
      const expectedLabel = getShapeLabel(expectedType);
      const clickedLabel = getShapeLabel(shape.type);
      const taskText = gameState.mode === "duo" && team
        ? `${team}點擊目標圖形：${expectedLabel}`
        : `點擊目標圖形：${expectedLabel}`;

      gameState.learningRecords.push({
        roundNumber: gameState.roundNumber,
        toolName: "圖形快落 Shape Rain",
        interactionType: "點擊圖形",
        task: taskText,
        studentAction: clickedLabel,
        expectedResult: expectedLabel,
        success: isCorrect ? "是" : "否",
        operationTime: formatLocalDateTime(new Date()),
        elapsedSeconds,
        score: getCurrentScore(),
        redScore: gameState.redScore,
        blueScore: gameState.blueScore,
        mode: gameState.mode === "duo" ? "雙人模式" : "單人模式",
        team,
        level: Math.floor(gameState.correctCount / 5) + 1,
        durationSeconds: gameState.duration,
        selectedShapes: gameState.selectedTypes.map(getShapeLabel).join("、"),
        roundStartedAt: gameState.roundStartedAt
      });
    }

    function getShapeLabel(type) {
      return config.shapeLabels[type] || type;
    }

    function getTeamNameForSide(side) {
      if (gameState.mode !== "duo") return "";
      return side === "left" ? "紅隊" : "藍隊";
    }

    function getCurrentScore() {
      if (gameState.mode === "duo") {
        return `紅隊 ${gameState.redScore}；藍隊 ${gameState.blueScore}`;
      }
      return gameState.score;
    }

    function downloadDetailCsv() {

      if (!studentName) return;

      const headers = [
        "學生／小組名稱",
        "局數",
        "工具名稱",
        "互動類型",
        "題目、任務或目標內容",
        "學生答案、選擇或操作內容",
        "正確答案、目標內容或期望結果",
        "是否答對、成功或完成",
        "作答或操作時間",
        "本局累積分數",
        "紅隊分數",
        "藍隊分數",
        "模式",
        "隊伍",
        "關卡",
        "本局已用秒數",
        "本局設定秒數",
        "本局圖形",
        "本局開始時間"
      ];
      const rows = gameState.learningRecords.map((record) => [
        studentName.displayName,
        record.roundNumber,
        record.toolName,
        record.interactionType,
        record.task,
        record.studentAction,

        record.score,
        record.redScore,

        record.team,
        record.level,
        record.elapsedSeconds,

        record.selectedShapes,
        record.roundStartedAt
      ]);

      downloadCsv("詳細紀錄", studentName.safeFilePrefix, headers, rows);

    function downloadMistakeCsv() {
      const studentName = getCsvStudentName();
      if (!studentName) return;

      const headers = [
        "學生／小組名稱",
        "題目、任務或目標內容",
        "錯誤答案、錯誤選擇或錯誤操作",
        "錯誤次數"
      ];
      const mistakeMap = new Map();

      gameState.learningRecords
        .filter((record) => record.success !== "是")
        .forEach((record) => {
          const key = `${record.task}\u0000${record.studentAction}`;
          const current = mistakeMap.get(key) || {
            task: record.task,
            studentAction: record.studentAction,
            count: 0
          };
          current.count += 1;
          mistakeMap.set(key, current);
        });

      const rows = mistakeMap.size
        ? Array.from(mistakeMap.values()).map((item) => [studentName.displayName, item.task, item.studentAction, item.count])
        : [[studentName.displayName, "本次頁面沒有錯題或錯誤操作", "", ""]];

      downloadCsv("錯題統計", studentName.safeFilePrefix, headers, rows);
    }

    function getCsvStudentName() {
      const prefix = prompt("請輸入檔名前綴，例如：3A_05 或 小組A。留空會使用「未命名」。");
      if (prefix === null) return null;

      const displayName = prefix.trim() || "未命名";
      return {
        displayName,
        safeFilePrefix: sanitizeFileName(displayName)
      };
    }

    function downloadCsv(recordType, safePrefix, headers, rows) {
      const safeToolName = sanitizeFileName("圖形快落");
      const timestamp = formatFileDateTime(new Date());
      const fileName = `${safePrefix}_${safeToolName}_${recordType}_${timestamp}.csv`;
      const csv = [headers, ...rows].map(formatCsvRow).join("\r\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function formatCsvRow(row) {
      return row.map((value) => {
        const text = value === null || value === undefined ? "" : String(value);
        return `"${text.replace(/"/g, '""')}"`;
      }).join(",");
    }

    function sanitizeFileName(value) {
      return value.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_") || "未命名";
    }

    function formatLocalDateTime(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-") + " " + [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join(":");
    }

    function formatFileDateTime(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("") + "_" + [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join("");
    }

    function findHitShapeIndex(x, y) {
      for (let i = gameState.shapes.length - 1; i >= 0; i -= 1) {
        const shape = gameState.shapes[i];
        const dx = x - shape.x;
        const dy = y - shape.y;
        if (Math.hypot(dx, dy) > shape.radius + 10) continue;

        const local = rotatePoint(dx, dy, -shape.rotation);
        if (isPointInsideShape(local.x, local.y, shape)) {
          return i;
        }
      }
      return -1;
    }

    function isPointInsideShape(x, y, shape) {
      if (shape.type === "rectangle" || shape.type === "square") {
        return Math.abs(x) <= shape.width / 2 && Math.abs(y) <= shape.height / 2;
      }
      return pointInPolygon({ x, y }, shape.points);
    }

    function pointInPolygon(point, points) {
      let inside = false;
      for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
        const xi = points[i].x;
        const yi = points[i].y;
        const xj = points[j].x;
        const yj = points[j].y;
        const crosses = yi > point.y !== yj > point.y;
        if (crosses) {
          const xAtY = ((xj - xi) * (point.y - yi)) / (yj - yi) + xi;
          if (point.x < xAtY) inside = !inside;
        }
      }
      return inside;
    }

    function endGame() {
      cancelAnimationFrame(gameState.animationId);
      stopBgm();
      gameState.screen = "ended";
      hud.classList.add("hidden");
      backToSettingsButton.classList.add("hidden");
      endScreen.classList.remove("hidden");
      finalScores.innerHTML = "";

      if (gameState.mode === "duo") {
        const winner = getWinnerText();
        resultTitle.textContent = winner;
        resultScore.textContent = "比賽結束";
        finalScores.innerHTML = `
          <div class="final-score-box" style="background: linear-gradient(135deg, #f06a66, #c83d46);"><small>紅隊</small>${gameState.redScore}</div>
          <div class="final-score-box" style="background: linear-gradient(135deg, #4388ea, #1f5bb9);"><small>藍隊</small>${gameState.blueScore}</div>
        `;
        buildConfetti();
      } else {
        resultTitle.textContent = "完成！";
        resultScore.textContent = `最終分數：${gameState.score}`;
        buildConfetti();
      }
    }

    function resetGame() {
      cancelAnimationFrame(gameState.animationId);
      stopBgm();
      gameState.screen = "menu";
      gameState.shapes = [];
      gameState.effects = [];
      hud.classList.add("hidden");
      backToSettingsButton.classList.add("hidden");
      endScreen.classList.add("hidden");
      menuScreen.classList.remove("hidden");
      confettiLayer.innerHTML = "";
      updateMenuValidation();
      drawGame();
    }

    function isDuoPreviewMode() {
      return previewParams.get("preview") === "duo";
    }

    function initDuoPreviewMode() {
      if (!isDuoPreviewMode()) return;

      cancelAnimationFrame(gameState.animationId);
      stopBgm();
      gameState.screen = "preview";
      gameState.mode = "duo";
      gameState.selectedTypes = ["rectangle", "square", "rhombus", "triangle", "trapezoid", "parallelogram"];
      gameState.assistEnabled = true;
      gameState.duration = 60;
      gameState.timeRemaining = 60;
      gameState.redTargetType = "rectangle";
      gameState.blueTargetType = "square";
      gameState.targetType = "rectangle";
      gameState.redScore = 0;
      gameState.blueScore = 0;
      gameState.score = 0;
      gameState.shapes = [];
      gameState.effects = [];

      menuScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      hud.classList.remove("hidden");
      backToSettingsButton.classList.add("hidden");
      confettiLayer.innerHTML = "";
      updateHud(false);
      buildDuoPreviewShapes();
      drawGame();
    }

    function buildDuoPreviewShapes() {
      const previewShapes = [
        ["rectangle", "left", 0.22, 0.36, 76, -0.08],
        ["triangle", "left", 0.34, 0.54, 72, 0.16],
        ["trapezoid", "left", 0.18, 0.71, 74, -0.22],
        ["square", "right", 0.68, 0.36, 74, 0.08],
        ["rhombus", "right", 0.80, 0.55, 76, -0.14],
        ["rectangle", "right", 0.66, 0.72, 70, 0.2]
      ];

      gameState.shapes = previewShapes.map(([type, side, xRatio, yRatio, size, rotation]) => {
        const shape = {
          type,
          x: gameState.width * xRatio,
          y: Math.max(config.safeTop + 88, gameState.height * yRatio),
          size,
          width: size,
          height: size,
          points: null,
          rotation,
          speed: 0,
          speedFactor: 0,
          color: config.typeStyles[type].fill,
          side,
          radius: size * 0.76,
          flash: 0
        };
        setShapeGeometry(shape);
        shape.x = clamp(shape.x, shape.radius + 8, gameState.width - shape.radius - 8);
        return shape;
      });
    }

    function enterFullscreen() {
      const app = document.querySelector(".app");
      if (!document.fullscreenElement && app.requestFullscreen) {
        app.requestFullscreen().catch(() => {});
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function updateFullscreenButtons() {
      fullscreenButtons.forEach((button) => {
        button.disabled = false;
      });
      exitFullscreenButtons.forEach((button) => {
        button.disabled = false;
      });
    }

    function updateHud(forcePulse) {
      const isDuo = gameState.mode === "duo";
      const centerStyle = config.typeStyles[gameState.targetType];
      const leftTargetType = isDuo ? gameState.redTargetType : gameState.targetType;
      const rightTargetType = isDuo ? gameState.blueTargetType : gameState.targetType;
      const leftStyle = config.typeStyles[leftTargetType];
      const rightStyle = config.typeStyles[rightTargetType];

      targetNameEl.textContent = config.shapeLabels[gameState.targetType];
      targetNameLeft.textContent = config.shapeLabels[leftTargetType];
      targetNameRight.textContent = config.shapeLabels[rightTargetType];
      targetSampleLeft.innerHTML = getShapeIconSvg(leftTargetType);
      targetSampleRight.innerHTML = getShapeIconSvg(rightTargetType);
      targetCard.style.setProperty("--target-color", centerStyle.accent);
      targetCard.style.setProperty("--target-soft", centerStyle.soft);
      targetSampleLeft.style.setProperty("--target-color", leftStyle.accent);
      targetSampleLeft.style.setProperty("--target-soft", leftStyle.soft);
      targetSampleRight.style.setProperty("--target-color", rightStyle.accent);
      targetSampleRight.style.setProperty("--target-soft", rightStyle.soft);
      targetNameLeft.style.setProperty("--target-color", leftStyle.accent);
      targetNameRight.style.setProperty("--target-color", rightStyle.accent);
      timeDisplay.textContent = formatTime(gameState.timeRemaining);
      hud.classList.toggle("single-mode", !isDuo);
      hud.classList.toggle("duo-mode", isDuo);
      hud.classList.toggle("assist", gameState.assistEnabled);
      hud.classList.toggle("no-assist", !gameState.assistEnabled);

      if (forcePulse && !isDuo) {
        targetNameEl.classList.remove("pulse");
        void targetNameEl.offsetWidth;
        targetNameEl.classList.add("pulse");
      }

      if (isDuo) {
        targetSampleRight.classList.remove("hidden");
        targetNameLeft.classList.remove("hidden");
        targetNameRight.classList.remove("hidden");
        scoreCard.classList.remove("single");
        scoreCard.classList.add("duo");
        scoreCard.innerHTML = `
          <span class="score-pill score-red"><small>紅隊</small><strong>${gameState.redScore}</strong></span>
          <span class="score-pill score-blue"><small>藍隊</small><strong>${gameState.blueScore}</strong></span>
        `;
      } else {
        targetSampleRight.classList.add("hidden");
        targetNameLeft.classList.add("hidden");
        targetNameRight.classList.add("hidden");
        scoreCard.classList.remove("duo");
        scoreCard.classList.add("single");
        scoreCard.innerHTML = `<span class="score-label">分數</span><span class="score-number">${gameState.score}</span>`;
      }
    }

    function getShapeIconSvg(type) {
      const style = config.typeStyles[type];
      const fill = style.fill;
      const stroke = "#26364f";

      if (type === "rectangle") {
        return `
          <svg viewBox="0 0 80 58" aria-hidden="true">
            <rect x="10" y="17" width="60" height="24" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          </svg>
        `;
      }

      if (type === "square") {
        return `
          <svg viewBox="0 0 80 58" aria-hidden="true">
            <rect x="21" y="10" width="38" height="38" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="4"/>
          </svg>
        `;
      }

      if (type === "rhombus") {
        return `
          <svg viewBox="0 0 80 58" aria-hidden="true">
            <path d="M40 12 70 29 40 46 10 29Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        `;
      }

      if (type === "triangle") {
        return `
          <svg viewBox="0 0 80 58" aria-hidden="true">
            <path d="M41 8 66 48H14Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        `;
      }

      if (type === "trapezoid") {
        return `
          <svg viewBox="0 0 80 58" aria-hidden="true">
            <path d="M26 12h30l12 36H13Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 80 58" aria-hidden="true">
          <path d="M26 12h43L54 48H11Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>
        </svg>
      `;
    }

    function formatTime(seconds) {
      const totalSeconds = Math.max(0, Math.ceil(seconds));
      const minutes = Math.floor(totalSeconds / 60);
      const restSeconds = totalSeconds % 60;
      return `${minutes}:${String(restSeconds).padStart(2, "0")}`;
    }

    function changeTarget() {
      if (gameState.mode === "duo") {
        setDuoTargets();
      } else {
        const available = gameState.selectedTypes.filter((type) => type !== gameState.targetType);
        gameState.targetType = pickRandom(available.length ? available : gameState.selectedTypes);
      }
      gameState.targetTimer = 0;
      const text = gameState.mode === "duo" ? "新目標" : `新目標：${config.shapeLabels[gameState.targetType]}`;
      addEffect(gameState.width / 2, config.safeTop + 58, text, "#1f5bb9", -12, "target");
      updateHud(true);
    }

    function drawEffect(effect) {
      const progress = 1 - effect.life / effect.maxLife;
      ctx.save();
      ctx.globalAlpha = clamp(effect.life / 260, 0, 1);
      ctx.translate(effect.x, effect.y);

      if (effect.kind === "correct") {
        ctx.strokeStyle = "rgba(24, 166, 117, " + (0.45 * (1 - progress)) + ")";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 24 + progress * 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (effect.kind === "spark") {
        ctx.rotate(effect.spin * progress);
        ctx.fillStyle = effect.color;
        drawStar(0, 0, effect.size, effect.size * 0.48, 5);
        ctx.fill();
        ctx.restore();
        return;
      }

      ctx.font = effect.kind === "target" ? "900 24px Microsoft JhengHei, Arial" : "950 30px Microsoft JhengHei, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillStyle = effect.color;
      ctx.strokeText(effect.text, 0, 0);
      ctx.fillText(effect.text, 0, 0);
      ctx.restore();
    }

    function addEffect(x, y, text, color, vy, kind) {
      gameState.effects.push({
        x,
        y,
        text,
        color,
        vy,
        kind,
        life: config.effectDuration,
        maxLife: config.effectDuration
      });
    }

    function addSparkles(x, y) {
      for (let i = 0; i < 5; i += 1) {
        const angle = random(0, Math.PI * 2);
        const distance = random(22, 46);
        gameState.effects.push({
          x: x + Math.cos(angle) * distance,
          y: y + Math.sin(angle) * distance,
          color: pickRandom(["#ffd35a", "#ff8b3d", "#67d6a2", "#6fc7ff"]),
          vy: random(-32, -12),
          kind: "spark",
          life: random(420, 690),
          maxLife: 690,
          size: random(7, 12),
          spin: random(-2.8, 2.8)
        });
      }
    }

    function getWinnerText() {
      if (gameState.redScore > gameState.blueScore) return "紅隊勝利";
      if (gameState.blueScore > gameState.redScore) return "藍隊勝利";
      return "平手";
    }

    function buildConfetti() {
      confettiLayer.innerHTML = "";
      const colors = ["#ff6b6b", "#4d96ff", "#ffd35a", "#67d6a2", "#b894f8", "#ff9f43"];
      for (let i = 0; i < 44; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${random(2, 98)}%`;
        piece.style.background = pickRandom(colors);
        piece.style.animationDelay = `${random(0, 620)}ms`;
        piece.style.animationDuration = `${random(1700, 2800)}ms`;
        piece.style.transform = `rotate(${random(0, 360)}deg)`;
        confettiLayer.appendChild(piece);
      }
    }

    function randomXForShape(shape, side) {
      const pad = Math.max(config.canvasPadding, shape.radius + 8);
      let min = pad;
      let max = gameState.width - pad;

      if (gameState.mode === "duo") {
        const mid = gameState.width / 2;
        if (side === "left") {
          min = pad;
          max = mid - pad;
        } else {
          min = mid + pad;
          max = gameState.width - pad;
        }
      }

      if (max < min) return gameState.width / 2;
      return random(min, max);
    }

    function balanceNextSide() {
      const leftCount = gameState.shapes.filter((shape) => shape.side === "left").length;
      const rightCount = gameState.shapes.filter((shape) => shape.side === "right").length;
      if (leftCount < rightCount) return "left";
      if (rightCount < leftCount) return "right";
      return Math.random() < 0.5 ? "left" : "right";
    }

    function updateSafeTop(width) {
      if (width <= 760) {
        config.safeTop = 132;
      } else if (width <= 1180) {
        config.safeTop = 150;
      } else {
        config.safeTop = 104;
      }
    }

    function resizeCanvas() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      updateSafeTop(width);
      gameState.width = width;
      gameState.height = height;
      gameState.dpr = dpr;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      gameState.shapes.forEach((shape) => {
        shape.x = clamp(shape.x, shape.radius + 8, width - shape.radius - 8);
      });
      drawGame();
    }

    function rotatePoint(x, y, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: x * cos - y * sin,
        y: x * sin + y * cos
      };
    }

    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function drawStar(x, y, outerRadius, innerRadius, points) {
      ctx.beginPath();
      for (let i = 0; i < points * 2; i += 1) {
        const angle = -Math.PI / 2 + (i * Math.PI) / points;
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.closePath();
    }

    function pickRandom(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function clampInt(value, min, max, fallback) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return fallback;
      return Math.max(min, Math.min(max, parsed));
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => {
      window.setTimeout(resizeCanvas, 150);
    });
    canvas.addEventListener("pointerdown", handlePointer, { passive: false });

    initMenu();
    resizeCanvas();
    initDuoPreviewMode();
  </script>

  <template id="ldl-copy-cost-markers" hidden>
    <!-- copy-cost marker: body-gamma YFC -->
    <!-- copy-cost marker: body-delta LD -->
  </template>
<script>
    "use strict";

    // ==================================================
    // LDL Source Reference v1.1
    // Creator credit + hidden ownership markers
    // // ==================================================
    const LDL_RELEASE_YEAR = 2026;
    const LDL_VERSION = "1.1.0";
    const LDL_PRODUCT_NAME = "圖形快落";
    const LDL_PRODUCT_NAME_EN = "Shape Rain";
    const LDL_PRODUCT_CODE = "LDL-MATH-G02-2026-001";
    const LDL_TOOL_ID = "G02-quadrilateral";
    const LDL_MODULE_ID = "ldl-g02-quadrilateral";
    const LDL_BUILD_ID = "LDL-MATH-G02-2026-001";
    const LDL_FINGERPRINT = "ldl-yfc-g02-quadrilateral-v1";
    const LDL_COMPANY = "Yung Fu Chuen";
    const LDL_AUTHOR = "Yung Fu Chuen";
    const LDL_VISIBLE_WATERMARK_TEXT = `© ${LDL_RELEASE_YEAR} · Yung Fu Chuen`;
    const LDL_COPYRIGHT = `© ${LDL_RELEASE_YEAR} Yung Fu Chuen. All rights reserved.`;
    const LDL_LICENSE = "Free classroom use only. Redistribution, resale, cloning, re-hosting, modification, or derivative use without written permission is prohibited.";
    const LDL_CONSOLE_MESSAGE = `© ${LDL_RELEASE_YEAR} Yung Fu Chuen｜Created by Yung Fu Chuen｜LDL Source Reference v1.1`;
    const LDL_MARKER_SIGNATURE = "LDL-SOURCE-REFERENCE-v1.1::Yung-Fu-Chuen::2026";

    function createLDLSourceRecord() {
      return Object.freeze({
        productName: LDL_PRODUCT_NAME,
        productNameEn: LDL_PRODUCT_NAME_EN,
        productCode: LDL_PRODUCT_CODE,
        toolId: LDL_TOOL_ID,
        moduleId: LDL_MODULE_ID,
        company: LDL_COMPANY,
        author: LDL_AUTHOR,
        releaseYear: LDL_RELEASE_YEAR,
        version: LDL_VERSION,
        copyright: LDL_COPYRIGHT,
        license: LDL_LICENSE,
        buildId: LDL_BUILD_ID,
        fingerprint: LDL_FINGERPRINT,
        markerSignature: LDL_MARKER_SIGNATURE
      });
    }

    function initLDLSourceReference() {
      try {
        const record = createLDLSourceRecord();
        setLDLCssCustomProperties(record);
        upsertLDLMetaTags(record);
        upsertLDLBodyAttributes(record);
        upsertLDLJsonRecord(record);
        upsertLDLHiddenDomReference(record);
        upsertLDLSvgMetadata(record);
        upsertLDLVisibleWatermark();

        Object.defineProperty(window, "__LDL_SOURCE_REFERENCE__", {
          value: record,
          writable: false,
          configurable: true,
          enumerable: false
        });

        console.info(LDL_CONSOLE_MESSAGE);
      } catch (error) {
        console.warn("LDL Source Reference failed to initialize.", error);
      }
    }

    function setLDLCssCustomProperties(record) {
      const root = document.documentElement;
      root.style.setProperty("--ldl-product-name", JSON.stringify(record.productName));
      root.style.setProperty("--ldl-product-name-en", JSON.stringify(record.productNameEn));
      root.style.setProperty("--ldl-product-code", JSON.stringify(record.productCode));
      root.style.setProperty("--ldl-tool-id", JSON.stringify(record.toolId));
      root.style.setProperty("--ldl-module-id", JSON.stringify(record.moduleId));
      root.style.setProperty("--ldl-company", JSON.stringify(record.company));
      root.style.setProperty("--ldl-author", JSON.stringify(record.author));
      root.style.setProperty("--ldl-release-year", String(record.releaseYear));
      root.style.setProperty("--ldl-version", JSON.stringify(record.version));
      root.style.setProperty("--ldl-build-id", JSON.stringify(record.buildId));
      root.style.setProperty("--ldl-fingerprint", JSON.stringify(record.fingerprint));
    }

    function upsertLDLMetaTags(record) {
      const metaValues = {
        author: record.author,
        company: record.company,
        copyright: record.copyright,
        license: record.license,
        "ldl-product-name": record.productName,
        "ldl-product-name-en": record.productNameEn,
        "ldl-product-code": record.productCode,
        "ldl-tool-id": record.toolId,
        "ldl-module-id": record.moduleId,
        "ldl-release-year": String(record.releaseYear),
        "ldl-version": record.version,
        "ldl-build-id": record.buildId,
        "ldl-fingerprint": record.fingerprint,
        "ldl-source-reference": `LDL Source Reference ${record.version} · ${record.company} · ${record.author}`
      };

      Object.entries(metaValues).forEach(([name, content]) => {
        let meta = document.head.querySelector(`meta[name="${name}"]`);
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", name);
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", content);
      });
    }

    function upsertLDLBodyAttributes(record) {
      const attrs = {
        "data-ldl-product-name": record.productName,
        "data-ldl-product-name-en": record.productNameEn,
        "data-ldl-product-code": record.productCode,
        "data-ldl-tool-id": record.toolId,
        "data-ldl-module-id": record.moduleId,
        "data-ldl-build-id": record.buildId,
        "data-ldl-fingerprint": record.fingerprint,
        "data-ldl-marker-signature": record.markerSignature
      };

      Object.entries(attrs).forEach(([name, value]) => {
        document.body.setAttribute(name, value);
      });
    }

    function upsertLDLJsonRecord(record) {
      let script = document.getElementById("ldl-source-reference");
      if (!script) {
        script = document.createElement("script");
        script.type = "application/json";
        script.id = "ldl-source-reference";
        document.body.appendChild(script);
      }
      script.textContent = JSON.stringify(record, null, 2);
    }

    function upsertLDLHiddenDomReference(record) {
      const hidden = getOrCreateLDLElement("div", "ldl-hidden-source-reference", document.body);
      hidden.className = "ldl-offscreen-source-reference";
      hidden.setAttribute("aria-hidden", "true");
      hidden.setAttribute("data-ldl-product-name", record.productName);
      hidden.setAttribute("data-ldl-product-name-en", record.productNameEn);
      hidden.setAttribute("data-ldl-product-code", record.productCode);
      hidden.setAttribute("data-ldl-tool-id", record.toolId);
      hidden.setAttribute("data-ldl-module-id", record.moduleId);
      hidden.setAttribute("data-ldl-company", record.company);
      hidden.setAttribute("data-ldl-author", record.author);
      hidden.setAttribute("data-ldl-release-year", String(record.releaseYear));
      hidden.setAttribute("data-ldl-version", record.version);
      hidden.setAttribute("data-ldl-build-id", record.buildId);
      hidden.setAttribute("data-ldl-fingerprint", record.fingerprint);
      hidden.setAttribute("data-ldl-marker-signature", record.markerSignature);
      hidden.textContent = [
        "LDL Source Reference",
        record.productName,
        record.productNameEn,
        record.productCode,
        record.toolId,
        record.moduleId,
        record.company,
        record.author,
        String(record.releaseYear),
        record.version,
        record.buildId,
        record.fingerprint,
        record.markerSignature,
        record.license
      ].join(" | ");
    }

    function upsertLDLSvgMetadata(record) {
      let svg = document.getElementById("ldl-hidden-svg-source-reference");
      if (!svg) {
        svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = "ldl-hidden-svg-source-reference";
        document.body.appendChild(svg);
      }
      svg.setAttribute("class", "ldl-offscreen-source-reference");
      svg.setAttribute("width", "0");
      svg.setAttribute("height", "0");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");

      let metadata = svg.querySelector("metadata");
      if (!metadata) {
        metadata = document.createElementNS("http://www.w3.org/2000/svg", "metadata");
        svg.appendChild(metadata);
      }
      metadata.textContent = JSON.stringify(record);
    }

    function upsertLDLVisibleWatermark() {
      const watermark = getOrCreateLDLElement("div", "ldl-visible-watermark", document.body);
      watermark.className = "ldl-visible-watermark";
      watermark.setAttribute("aria-hidden", "true");

      let text = watermark.querySelector("span");
      if (!text) {
        text = document.createElement("span");
        watermark.appendChild(text);
      }
      text.textContent = LDL_VISIBLE_WATERMARK_TEXT;
    }

    function getOrCreateLDLElement(tagName, id, parent) {
      let element = document.getElementById(id);
      if (!element) {
        element = document.createElement(tagName);
        element.id = id;
        parent.appendChild(element);
      }
      return element;
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initLDLSourceReference, { once: true });
    } else {
      initLDLSourceReference();
    }
  </script>
